name: Tests

# Qué es esto: cada vez que subes a main (desarrollo) o a master (publicaciones),
# GitHub arranca una máquina limpia, instala Lune y corre los tests. Si algo falla te llega el aviso "Tests
# workflow run failed". No hace falta para usar Lune: es solo el chequeo
# automático. Si no lo quieres, borra la carpeta .github/ y se acabó.
#
# Hasta 10.0 este job instalaba solo requests+psutil, y desde la serie 9 los
# tests tocan PyQt6, pygame y compañía: por eso fallaba SIEMPRE. Ahora instala
# requirements.txt (igual que instalar_lune.bat) y corre Qt sin pantalla.
# Desde 10.3 también PyQt6-WebEngine: es la «Interfaz completa» que ofrece el
# instalador y la usan la piel web, la asistente animada y el VRM. Sin él fallaban
# ~100 tests (la cruz roja «1 / 2» de cada commit hasta 10.7).

# Dos ramas (desde la 11.3): en main se trabaja día a día y en master solo entra lo
# que se publica. Los tests corren en las dos; el Release (release.yml) solo sale de
# master.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen      # Qt sin ventana (la máquina de CI no tiene escritorio)
      SDL_AUDIODRIVER: dummy          # pygame sin tarjeta de sonido
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest numpy PyQt6-WebEngine

      - name: Tests
        run: python -m pytest -q

      - name: Comprobar que todos los módulos compilan
        run: python -m compileall -q main.py patata.py instalador.py nucleo servicios ui lune_core scripts

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # datos.json lleva las API keys y NO debe volver al repo.
      # La fuga anterior vino de una línea corrupta en .gitignore.
      - name: datos.json no debe estar versionado
        run: |
          if git ls-files --error-unmatch datos.json 2>/dev/null; then
            echo "::error::datos.json está versionado y contiene las API keys."
            exit 1
          fi
          echo "OK: datos.json no está en el repo."

      - name: Sin claves de OpenRouter en el código
        run: |
          if git grep -nE 'sk-or-v1-[A-Za-z0-9]{20,}' -- . ; then
            echo "::error::Hay una API key de OpenRouter en el código."
            exit 1
          fi
          echo "OK: sin claves a la vista."
