<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lune VRM</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #c { display: block; width: 100vw; height: 100vh; }
  #aviso {
    position: fixed; inset: 0; display: none; place-content: center; text-align: center;
    font: 14px/1.5 system-ui, sans-serif; color: #eee; background: rgba(20,20,28,.78);
    padding: 24px; box-sizing: border-box;
  }
  #aviso.on { display: grid; }
  #aviso code { color: #a5b4fc; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="aviso"></div>

<!-- three.js + @pixiv/three-vrm por importmap. WebEngine (Chromium) soporta importmaps. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.6/lib/three-vrm.module.min.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const aviso = document.getElementById('aviso');
function mostrarAviso(html) { aviso.innerHTML = html; aviso.classList.add('on'); }
window.addEventListener('error', e => {
  mostrarAviso(`<div><b>No se pudo cargar el visor 3D.</b><br>` +
    `Revisa la conexión (three.js viene de un CDN) o el archivo <code>.vrm</code>.<br>` +
    `<small>${(e.message || e.error || '').toString().slice(0,180)}</small></div>`);
});

// ── Fuente del modelo: ?src=<url|ruta>. Por defecto, "model.vrm" junto a la página.
const params = new URLSearchParams(location.search);
const SRC = params.get('src') || 'model.vrm';

// ── Escena ────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);            // fondo transparente (para overlay)

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 20);
camera.position.set(0, 1.32, 1.15);             // encuadre de retrato (cara/torso)

const luzDir = new THREE.DirectionalLight(0xffffff, Math.PI);
luzDir.position.set(1, 1.4, 1.2);
scene.add(luzDir);
scene.add(new THREE.AmbientLight(0xffffff, 1.1));

function ajustar() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', ajustar);
ajustar();

// ── Mapa de emociones de Lune → expresiones VRM ────────────────────────────────
// Vocabulario de Lune: happy, sad, angry, think, surprised, awkward, question,
// curious, neutral. VRM presets: happy, angry, sad, relaxed, surprised, neutral.
const MAPA = {
  happy:     { happy: 1.0 },
  sad:       { sad: 1.0 },
  angry:     { angry: 1.0 },
  surprised: { surprised: 1.0 },
  think:     { relaxed: 0.6 },
  question:  { surprised: 0.4, relaxed: 0.3 },
  curious:   { relaxed: 0.5, happy: 0.2 },
  awkward:   { relaxed: 0.7 },
  neutral:   { neutral: 1.0 },
  // v10: emociones nuevas del vocabulario (aproximadas con las expresiones VRM estándar)
  nervous:   { relaxed: 0.6, sad: 0.2 },
  wave:      { happy: 0.9 },
  dismiss:   { angry: 0.45, relaxed: 0.3 },
};
const EXPRS = ['happy', 'sad', 'angry', 'relaxed', 'surprised', 'neutral'];

let vrm = null;
let objetivo = { neutral: 1.0 };     // pesos deseados
let actual = {};                     // pesos aplicados (para suavizar)
let hablando = false;

// API pública para Python (QWebEngineView.page().runJavaScript(...)).
window.luneSetEmotion = function (nombre, intensidad = 1.0) {
  const base = MAPA[String(nombre || 'neutral').toLowerCase()] || MAPA.neutral;
  const o = {};
  for (const k of EXPRS) o[k] = (base[k] || 0) * intensidad;
  objetivo = o;
};
window.luneSpeak = function (on) { hablando = !!on; };   // mueve la boca mientras habla
window.luneReady = false;

// ── Carga del VRM ──────────────────────────────────────────────────────────────
const loader = new GLTFLoader();
loader.register(parser => new VRMLoaderPlugin(parser));
loader.crossOrigin = 'anonymous';

loader.load(SRC, (gltf) => {
  vrm = gltf.userData.vrm;
  VRMUtils.removeUnnecessaryVertices(gltf.scene);
  VRMUtils.combineSkeletons(gltf.scene);
  vrm.scene.traverse(o => { o.frustumCulled = false; });
  // Mirar a cámara y orientar de frente.
  VRMUtils.rotateVRM0(vrm);            // los VRM 0.x miran a +Z; girarlos a -Z
  scene.add(vrm.scene);
  // Encuadrar la cabeza si el hueso existe.
  try {
    const head = vrm.humanoid?.getNormalizedBoneNode('head');
    if (head) {
      const p = new THREE.Vector3();
      head.getWorldPosition(p);
      camera.position.set(0, p.y, 0.9);
      camera.lookAt(0, p.y - 0.05, 0);
    }
  } catch (_) {}
  window.luneReady = true;
  document.title = 'Lune VRM listo';   // Python puede detectar readiness por el título
}, undefined, (err) => {
  mostrarAviso(`<div><b>No se pudo abrir el modelo.</b><br>` +
    `<code>${SRC}</code><br><small>${(err && err.message) || err || ''}</small></div>`);
});

// ── Bucle de animación: parpadeo, respiración, boca, mirada, suavizado ─────────
const clock = new THREE.Clock();
let tParpadeo = 2 + Math.random() * 3;
let parpadeo = 0;
const raton = { x: 0, y: 0 };
window.addEventListener('pointermove', e => {
  raton.x = (e.clientX / window.innerWidth) * 2 - 1;
  raton.y = -((e.clientY / window.innerHeight) * 2 - 1);
});

function mezclar(a, b, t) { return a + (b - a) * t; }

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (vrm) {
    const em = vrm.expressionManager;
    if (em) {
      // Suavizar hacia el objetivo.
      for (const k of EXPRS) {
        const dest = objetivo[k] || 0;
        actual[k] = mezclar(actual[k] || 0, dest, 1 - Math.exp(-8 * dt));
        em.setValue(k, actual[k]);
      }
      // Parpadeo natural.
      tParpadeo -= dt;
      if (tParpadeo <= 0) { parpadeo = 1; tParpadeo = 2.5 + Math.random() * 3.5; }
      parpadeo = Math.max(0, parpadeo - dt * 7);
      em.setValue('blink', parpadeo * parpadeo);
      // Boca al hablar (viseme 'aa' oscilante).
      const boca = hablando ? (0.35 + 0.35 * Math.sin(clock.elapsedTime * 18)) : 0;
      em.setValue('aa', Math.max(0, boca));
    }
    // Mirada suave hacia el puntero.
    if (vrm.lookAt) {
      vrm.lookAt.target = vrm.lookAt.target || new THREE.Object3D();
      vrm.lookAt.target.position.set(raton.x * 0.5, 1.3 + raton.y * 0.3, 1.0);
      if (!vrm.lookAt.target.parent) scene.add(vrm.lookAt.target);
    }
    // Respiración: leve balanceo del torso.
    const spine = vrm.humanoid?.getNormalizedBoneNode('spine');
    if (spine) spine.rotation.x = Math.sin(clock.elapsedTime * 1.1) * 0.015;

    vrm.update(dt);
  }
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
