<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lune · terminal</title>
<style>
  :root { --bg:#080B16; --surface:#0F1424; --surface2:#141B30; --border:#2E3D66;
          --text:#EAF1FF; --muted:#97A6C4; --accent:#00E5FF; --blue:#1E55FF; --err:#FF3B5C; }
  * { box-sizing:border-box; }
  body { margin:0; height:100dvh; display:flex; flex-direction:column;
         background:var(--bg); color:var(--text); font:14px/1.5 system-ui,Segoe UI,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px;
           background:var(--surface); border-bottom:2px solid var(--border); }
  header b { letter-spacing:2px; } header .sp { flex:1; }
  #estado { font:12px monospace; color:var(--muted); }
  #dot { color:var(--err); } #dot.on { color:var(--accent); }
  #chat { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:80%; padding:9px 13px; border-radius:8px; white-space:pre-wrap; word-break:break-word; }
  .yo { align-self:flex-end; background:linear-gradient(135deg,#0E2FA8,#1E55FF); }
  .lune { align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--accent); }
  .sys { align-self:center; color:var(--muted); font:12px monospace; }
  footer { display:flex; gap:8px; padding:12px 14px; background:var(--surface); border-top:2px solid var(--border); }
  input,button { font:14px inherit; border-radius:6px; border:2px solid var(--border); }
  #txt { flex:1; padding:11px 14px; background:var(--surface2); color:var(--text); }
  #txt:focus { outline:none; border-color:var(--accent); }
  button { padding:0 18px; background:var(--accent); color:var(--bg); font-weight:bold; cursor:pointer; border:none; }
  button:disabled { background:var(--surface2); color:var(--muted); cursor:default; }
  #login { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; }
  #login input { padding:11px 14px; width:min(340px,90vw); background:var(--surface2); color:var(--text); }
  #login .err { color:var(--err); font:13px monospace; min-height:18px; }
  .oculto { display:none !important; }
</style>
</head>
<body>
  <div id="login">
    <div style="font-size:40px">🌙</div>
    <div><b style="letter-spacing:3px">LUNE CD</b> · terminal web</div>
    <div style="color:var(--muted);max-width:360px">Introduce el token del host (Ajustes → Red de Lune → GENERAR TOKEN).</div>
    <input id="tok" type="password" placeholder="token del host" autocomplete="off">
    <button id="entrar">Conectar</button>
    <div class="err" id="loginErr"></div>
  </div>

  <header class="oculto" id="app">
    <span style="font-size:20px">🌙</span><b>LUNE</b>
    <span class="sp"></span>
    <span id="estado"><span id="dot">●</span> <span id="estadoTxt">conectando…</span></span>
  </header>
  <div id="chat" class="oculto"></div>
  <footer class="oculto" id="barra">
    <input id="txt" placeholder="Escribe a Lune…  (Enter para enviar)" autocomplete="off">
    <button id="enviar">Enviar</button>
  </footer>

<script>
const $ = s => document.querySelector(s);
const RUTA_WS = "/ws";
let ws = null, token = "", pendientes = new Map(), miId = "web-" + Math.random().toString(36).slice(2,8);

function idEvento(){ return (crypto.randomUUID?crypto.randomUUID():String(Math.random())).replace(/-/g,""); }
function sobre(type, data, parentId){
  const ev = { type, data:data||{}, meta:{ source:{id:miId, kind:"web"}, id:idEvento(), parent_id:parentId||null, ts:new Date().toISOString().slice(0,19) } };
  return ev;
}
function burbuja(clase, texto){
  const d = document.createElement("div"); d.className = "msg "+clase; d.textContent = texto;
  $("#chat").appendChild(d); $("#chat").scrollTop = $("#chat").scrollHeight;
}
function estado(txt, on){ $("#estadoTxt").textContent = txt; $("#dot").className = on?"on":""; }

function conectar(){
  const puertoWs = window.LUNE_WS_PORT || location.port; const url = (location.protocol==="https:"?"wss://":"ws://") + location.hostname + ":" + puertoWs + RUTA_WS;
  ws = new WebSocket(url);
  let fase = "auth", idA=null, idAnn=null;
  ws.onopen = () => { estado("autenticando…", false); const e=sobre("auth",{token}); idA=e.meta.id; ws.send(JSON.stringify(e)); };
  ws.onmessage = m => {
    let ev; try { ev = JSON.parse(m.data); } catch { return; }
    if (fase==="auth" && ev.meta?.parent_id===idA){
      if (ev.type==="error"){ mostrarLogin(ev.data?.message||"token inválido"); ws.close(); return; }
      const e=sobre("announce",{name:miId,kind:"web",events:["input:text"]}); idAnn=e.meta.id; fase="ann"; ws.send(JSON.stringify(e)); return;
    }
    if (fase==="ann" && ev.meta?.parent_id===idAnn){ fase="ready"; entrarApp(); return; }
    manejar(ev);
  };
  ws.onclose = () => { estado("desconectado — reintentando", false); if(fase==="ready") setTimeout(conectar, 2000); };
  ws.onerror = () => {};
}

function manejar(ev){
  const fut = ev.meta?.parent_id && pendientes.get(ev.meta.parent_id);
  if (fut){ pendientes.delete(ev.meta.parent_id); fut(ev); return; }
  if (ev.type==="output:chat:done"){ burbuja("lune", ev.data?.text || ""); }
  else if (ev.type==="host:status"){ estado("host: " + (ev.data?.model||"?") + (ev.data?.busy?" · ocupado":""), true); }
  else if (ev.type==="memory:changed"){ /* alguien cambió la memoria */ }
}

function pedir(type, data, ms=8000){
  return new Promise((res,rej)=>{
    const e=sobre(type,data); const to=setTimeout(()=>{pendientes.delete(e.meta.id);rej(new Error("sin respuesta"));},ms);
    pendientes.set(e.meta.id, ev=>{clearTimeout(to);res(ev);});
    ws.send(JSON.stringify(e));
  });
}

function entrarApp(){
  $("#login").classList.add("oculto");
  ["#app","#chat","#barra"].forEach(s=>$(s).classList.remove("oculto"));
  estado("conectado", true);
  burbuja("sys", "Conectado al host. Prueba /memoria — el chat con IA llega con el agente en el host.");
  $("#txt").focus();
}
function mostrarLogin(err){
  $("#login").classList.remove("oculto");
  ["#app","#chat","#barra"].forEach(s=>$(s).classList.add("oculto"));
  $("#loginErr").textContent = err||"";
}

async function enviar(){
  const t = $("#txt").value.trim(); if(!t || !ws || ws.readyState!==1) return;
  $("#txt").value=""; burbuja("yo", t);
  if (t === "/memoria"){
    try { const r = await pedir("memory:query",{que:"listar"}); burbuja("lune", r.data?.resultado || "(memoria vacía)"); }
    catch { burbuja("sys","el host no respondió"); }
    return;
  }
  if (t.startsWith("recuerda ") || t.startsWith("/recuerda ")){
    try { const r = await pedir("memory:remember",{mensaje:t.replace(/^\/recuerda /,"recuerda ")}); burbuja("lune", r.data?.resultado || "anotado"); }
    catch { burbuja("sys","el host no respondió"); }
    return;
  }
  // Chat normal: se emite al host; responderá cuando el agente viva ahí (9.x).
  ws.send(JSON.stringify(sobre("input:text",{text:t})));
  burbuja("sys","(enviado; el chat con IA responderá cuando el agente esté en el host)");
}

$("#entrar").onclick = () => { token = $("#tok").value.trim(); $("#loginErr").textContent="conectando…"; conectar(); };
$("#tok").addEventListener("keydown", e=>{ if(e.key==="Enter") $("#entrar").click(); });
$("#enviar").onclick = enviar;
$("#txt").addEventListener("keydown", e=>{ if(e.key==="Enter") enviar(); });
</script>
</body>
</html>
