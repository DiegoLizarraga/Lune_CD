<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>

<body class="lune-backdrop">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script type="text/babel">
    const NS = window.LuneCDShibuyaPunkDesignSystem_8598db;
    const { Badge, StatusPill } = NS;
    function Demo(){
      return (
        <div>
          <p className="lbl">Badge — solid</p>
          <div className="row">
            <Badge variant="cyan">v7.8</Badge>
            <Badge variant="blue">Nube</Badge>
            <Badge variant="yellow">Local</Badge>
            <Badge variant="danger">Offline</Badge>
            <Badge variant="ink">openrouter/auto</Badge>
          </div>
          <p className="lbl">Badge — outline</p>
          <div className="row">
            <Badge variant="cyan" outline>0.1s</Badge>
            <Badge variant="blue" outline>memoria</Badge>
            <Badge variant="yellow" outline>edge-tts</Badge>
          </div>
          <p className="lbl">StatusPill</p>
          <div className="row">
            <StatusPill status="live" />
            <StatusPill status="busy">Procesando…</StatusPill>
            <StatusPill status="error">Sin conexión</StatusPill>
            <StatusPill status="off" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
