<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body{ margin:0; padding:24px; }
  .wrap{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }
  .col{ display:flex; flex-direction:column; gap:14px; }
  .lbl{ font:var(--text-overline); letter-spacing:var(--ls-mega); color:var(--text-dim); text-transform:uppercase; margin:0; }
</style></head>
<body class="lune-backdrop">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const NS = window.LuneCDShibuyaPunkDesignSystem_8598db;
    const { Input, Switch } = NS;
    function Demo(){
      const [v, setV] = React.useState(true);
      return (
        <div className="wrap">
          <div className="col">
            <Input label="API Key de OpenRouter" type="password" defaultValue="sk-or-v1-9f2a" hint="Se guarda localmente en datos.json" leading="⌗" />
            <Input label="Modelo" defaultValue="openrouter/auto" />
          </div>
          <div className="col">
            <Input label="System Prompt" textarea rows={3} defaultValue={"Eres Lune. Directa, con personalidad. Sin relleno."} />
            <p className="lbl">Toggles</p>
            <Switch label="Voz (edge-tts)" checked={v} onChange={e=>setV(e.target.checked)} />
            <Switch label="Modo offline" accent="blue" defaultChecked />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body></html>
