<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Corte 9: fetch/XHR solo al servidor local de la asistente (y blob:/data:), aunque un
     .vrma o un script lo intenten (crítica d). Si rompiera algo en pantalla, se quita. -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'self' blob: data:" />
<title>Lune VRM</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="css/burbuja.css" />
<!-- Cortes 5 y 6: pantalla grande y salvapantallas, burbuja de alarma y notas del baile -->
<link rel="stylesheet" href="css/grande.css" />
<link rel="stylesheet" href="css/alarma.css" />
<link rel="stylesheet" href="css/baile.css" />
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
    font-family:var(--font-body, system-ui, sans-serif); }
  #wrap { display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    height:100vh; gap:6px; padding:6px; box-sizing:border-box; }

  /* Burbuja de comentario (misma que companion.html) */
  #bubble { max-width:92%; background:var(--ink-800,#0F1424); color:var(--paper,#EAF1FF);
    border:2px solid var(--cyan-700,#0091AB); border-radius:3px; clip-path:var(--clip-tr, none);
    padding:9px 12px; font-size:12.5px; line-height:1.38; box-shadow:0 6px 22px rgba(0,0,0,.55);
    opacity:0; transform:translateY(6px); transition:opacity .25s, transform .25s; pointer-events:none; }
  #bubble.on { opacity:1; transform:translateY(0); }
  #bubble .who { font-family:var(--font-mono, monospace); font-size:9px; letter-spacing:.12em;
    color:var(--cyan-400,#36ECFF); text-transform:uppercase; display:block; margin-bottom:3px; }
  #bubble .who .jp { color:var(--yellow-500,#FFE000); }

  /* El avatar 3D: sin marco ni fondo, la ventana recorta a lo que pinta el modelo */
  #stage { position:relative; flex:1; min-height:0; width:100%; }
  #c { display:block; width:100%; height:100%; }

  /* "z z z" mientras duerme. Solo existen (y se animan) dormida: con opacity 0 sus tres animaciones
     infinitas seguían vivas y obligaban a Chromium a sacar 60 frames por segundo, que en esta ventana
     translúcida Qt copia de la GPU a la CPU uno a uno. */
  #zzz { position:absolute; top:6%; right:14%; pointer-events:none; display:none;
    font-family:var(--font-display, var(--font-mono, monospace)); font-weight:700; color:var(--cyan-400,#36ECFF);
    text-shadow:0 0 10px rgb(var(--cyan-400-rgb, 54 236 255) / .6); }
  #zzz.on { display:block; animation:zzz-in .6s ease-out; }
  #zzz span { position:absolute; right:0; font-size:14px; }
  #zzz.on span { animation:zzz 2.4s linear infinite; }
  #zzz.on span:nth-child(2) { animation-delay:-.8s; }
  #zzz.on span:nth-child(3) { animation-delay:-1.6s; }
  #zzz span:nth-child(2) { font-size:18px; right:10px; }
  #zzz span:nth-child(3) { font-size:22px; right:22px; }
  @keyframes zzz-in { from{ opacity:0; } to{ opacity:1; } }
  @keyframes zzz { 0%{ transform:translate(0,0) rotate(0); opacity:0; } 15%{ opacity:.9; } 100%{ transform:translate(14px,-46px) rotate(18deg); opacity:0; } }

  #aviso { position:absolute; inset:0; display:none; place-content:center; text-align:center;
    font:12.5px/1.5 var(--font-body, system-ui, sans-serif); color:#eee; background:rgb(var(--ink-800-rgb, 15 20 36) / .86);
    border:2px solid var(--cyan-700,#0091AB); padding:18px; box-sizing:border-box; }
  #aviso.on { display:grid; }
  #aviso code { color:#a5b4fc; word-break:break-all; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bubble"><span class="who"><span class="jp">月</span> Lune</span><span id="btxt"></span></div>
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="zzz"><span>z</span><span>z</span><span>z</span></div>
    <div id="aviso"></div>
  </div>
</div>

<!-- APIs compartidas con companion.html (scripts clásicos, antes del módulo):
     cola de eventos hacia Python (luneEventos), efectos de sonido (luneSfx), packs de
     sonidos de reacción (luneSonidos; ui/companion.py le carga el pack al terminar la
     página) y la burbuja con máquina de escribir (comentarTipeado, burbujaTexto,
     burbujaFin, luneLado). tema.js: window.luneTema(mapa|null), el tema de color
     (ui/companion.py → aplicar_tema). -->
<script src="lune_eventos.js"></script>
<script src="lune_sfx.js"></script>
<script src="lune_packs.js"></script>
<script src="lune_burbuja.js"></script>
<script src="tema.js"></script>
<!-- Cortes 5 y 6 (scripts clásicos, también en companion.html): reloj del pulso y notas
     ♪ (LuneRitmo, LuneNotas), burbuja de alarma (LuneAlarma) y salvapantallas / clase de
     pantalla grande (LunePantalla). -->
<script src="lune_ritmo.js"></script>
<script src="lune_alarma.js"></script>
<script src="lune_pantalla.js"></script>
<!-- Corte 9 (script clásico, también en companion.html): la canción de un baile en esta
     página, su reloj y el pulso (LuneMMDAudio). -->
<script src="lune_mmd_audio.js"></script>
<script>
  // Calibración del modelo (luz, altura, pesos de seguimiento, invertir*): Python puede
  // llamarla antes de que cargue el módulo. Se guarda la última y el módulo la aplica.
  window.luneParams = function (j) { window.__luneParamsPendiente = j; return null; };

  // Cortes 5 y 6 (ui/companion.py: set_salvapantallas, mostrar_alarma, grande_fase,
  // bailar, pulso). Salvapantallas y alarma son del DOM y van ya; pantalla grande,
  // sujetar el pelo y el baile son módulos del avatar que registra el módulo de abajo:
  // hasta entonces se guarda la última llamada de cada una y el módulo la repite.
  window.__lunePantalla = window.LunePantalla ? window.LunePantalla.crear({ doc: document }) : null;
  window.__luneAlarmaUI = window.LuneAlarma ? window.LuneAlarma.crear({ doc: document }) : null;
  window.luneSalvapantallas = function (on, o) {
    var p = window.__lunePantalla;
    return p ? p.salvapantallas(!!on, o || {}) : false;
  };
  window.luneAlarma = function (texto, o) {
    var a = window.__luneAlarmaUI;
    if (!a) return false;
    return texto == null ? a.ocultar() : a.mostrar(String(texto), o || {});
  };
  window.__luneOcioPendiente = {};
  window.luneGrande = function (fase, o) {
    if (window.__lunePantalla) window.__lunePantalla.fase(fase);
    window.__luneOcioPendiente.grande = [fase, o];
    return false;
  };
  window.luneHold = function () { return false; };
  window.luneBailar = function (on, o) { window.__luneOcioPendiente.bailar = [on, o]; return false; };
  window.lunePulso = function (b, f, e) { window.__luneOcioPendiente.pulso = [b, f, e]; return false; };

  // Cortes 7 y 8 (ui/companion.py: asiento, punto_asiento, comer, set_comida_activa):
  // sentarse y la reacción a la comida son módulos del avatar (vrm/lune_sentarse.js,
  // vrm/lune_comida.js). Hasta que cargan se guarda la última llamada de cada una y el
  // módulo la repite; el punto de asiento aún no se sabe ('null': Python usa su respaldo).
  window.__luneVidaPendiente = {};
  window.luneSentar = function (modo, v) { window.__luneVidaPendiente.sentar = [modo, v]; return 'null'; };
  window.luneSeatPx = function () { return 'null'; };
  window.luneComer = function (tipo, ms) { window.__luneVidaPendiente.comer = [tipo, ms]; return false; };
  window.luneComidaActiva = function (on) { window.__luneVidaPendiente.comida = [on]; return false; };

  // Corte 9 (ui/companion.py: mmd): el reproductor de bailes es un módulo del avatar
  // (vrm/lune_mmd.js) que se importa y registra al pedir el primer baile. Hasta que carga
  // el módulo de abajo, se guarda el último «cargar» con las banderas que lleguen detrás
  // (pausa, volumen, offset, en_sitio, bucle) y se repiten; «parar» lo olvida todo.
  window.luneMMD = function (orden, o) {
    var p = window.__luneOcioPendiente;
    if (!p) return false;
    var m = p.mmd || (p.mmd = { cargar: null, banderas: [] });
    orden = String(orden || '');
    if (orden === 'estado') return JSON.stringify({ fase: m.cargar ? 'cargando' : 'parado', pendiente: true });
    if (orden === 'cargar') { m.cargar = o; m.banderas = []; return true; }
    if (orden === 'parar') { m.cargar = null; m.banderas = []; return true; }
    if (['pausa', 'volumen', 'offset', 'en_sitio', 'bucle'].indexOf(orden) < 0) return false;
    m.banderas = m.banderas.filter(function (b) { return b[0] !== orden; });
    m.banderas.push([orden, o]);
    return true;
  };

  // Si el módulo principal no llega a ejecutarse (404 o error de sintaxis en lune_vrm.js,
  // lune_modulos.js o three), su propio aviso nunca se registra: este lo cubre. En captura
  // para ver también el 'error' del <script> (no burbujea). Como texto, nunca innerHTML.
  window.addEventListener('error', function (e) {
    if (window.setEmocion) return;                       // el módulo ya arrancó: avisa él
    var t = e.target;
    if (t && t !== window && t.tagName !== 'SCRIPT') return;   // otra hoja/imagen: no tapa nada
    var a = document.getElementById('aviso');
    if (!a) return;
    var caja = document.createElement('div');
    var b = document.createElement('b'); b.textContent = 'No se pudo cargar el visor 3D.';
    caja.appendChild(b);
    var detalle = e.message || (t && t.src) || '';
    if (detalle) {
      caja.appendChild(document.createElement('br'));
      var s = document.createElement('small'); s.textContent = String(detalle).slice(0, 300);
      caja.appendChild(s);
    }
    a.replaceChildren(caja); a.classList.add('on'); document.title = 'Lune VRM error';
  }, true);
</script>

<!-- three.js, @pixiv/three-vrm y @pixiv/three-vrm-animation (corte 9) empaquetados en
     ui_web/vendor (sin red; versiones y hashes en vendor/three/VENDOR.json). -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/",
    "@pixiv/three-vrm": "./vendor/three/three-vrm.module.min.js",
    "@pixiv/three-vrm-animation": "./vendor/three/three-vrm-animation.module.min.js"
  }
}
</script>
<script type="module">
import { crearAsistente } from './vrm/lune_vrm.js';

const params = new URLSearchParams(location.search);
const SRC = params.get('src') || '/vrm/actual.vrm';
const ENC = params.get('enc') === 'cuerpo' ? 'cuerpo' : 'retrato';

const zzz = document.getElementById('zzz'), aviso = document.getElementById('aviso');

// El aviso va como TEXTO (textContent), nunca innerHTML: el mensaje de error puede
// traer cadenas del propio .vrm (metadatos, nombres) y la ruta viene de la URL.
function mostrarAviso(titulo, detalle, ruta) {
  const caja = document.createElement('div');
  const b = document.createElement('b'); b.textContent = titulo; caja.appendChild(b);
  if (ruta) {
    caja.appendChild(document.createElement('br'));
    const c = document.createElement('code'); c.textContent = String(ruta); caja.appendChild(c);
  }
  if (detalle) {
    caja.appendChild(document.createElement('br'));
    const s = document.createElement('small'); s.textContent = String(detalle).slice(0, 300); caja.appendChild(s);
  }
  aviso.replaceChildren(caja);
  aviso.classList.add('on'); document.title = 'Lune VRM error';
}
// Solo los fallos de arranque (módulos, WebGL) tapan el escenario; un error puntual
// con el modelo ya cargado se registra y no se pinta encima del avatar.
window.addEventListener('error', (e) => {
  if (window.luneReady) { console.warn('lune_vrm', e.message || e.error); return; }
  mostrarAviso('No se pudo cargar el visor 3D.', String(e.message || e.error || '').slice(0, 200));
});

// Los comentarios de la asistente (arrastre, soltar, caricia, dormir, despertar, mareo)
// los decide Python (lune_core/frases_asistente.py) con los eventos de window.luneEventos:
// aquí solo lo visual.
const asistente = crearAsistente({
  canvas: document.getElementById('c'), src: SRC + (SRC.includes('?') ? '&' : '?') + 'v=' + (params.get('v') || '0'),
  encuadre: ENC,
  onEvento: (tipo, dato) => {
    if (tipo === 'listo') { aviso.classList.remove('on'); document.title = 'Lune VRM listo'; window.luneReady = true; }
    else if (tipo === 'error') { mostrarAviso('No pude abrir el modelo.', dato, SRC); }
    else if (tipo === 'dormir') {
      zzz.classList.toggle('on', !!dato);
      // Al dormirse se quita lo que quede en la burbuja (la respuesta de la IA). La
      // frase de dormir la pone Python DESPUÉS, al leer el evento 'dormir' de la cola.
      if (dato && typeof window.ocultarBurbuja === 'function') window.ocultarBurbuja();
    }
  },
});

// ── API para Python (QWebEngineView.page().runJavaScript) ─────────────────────
window.luneReady = false;
window.setEmocion = (s) => asistente.setEstado(s);                 // mismo nombre que companion.html
window.luneSetEmotion = (s) => asistente.setEstado(s);             // compat con el visor anterior
// La voz manda sobre la boca; mientras suena, la máquina de escribir no la toca.
window.luneSpeak = (on) => { asistente.setHablando(!!on); if (window.luneBurbuja) window.luneBurbuja.setVoz(!!on); };
window.luneCursor = (nx, ny, px, py, dentro) => asistente.cursor(nx, ny, px, py, dentro);   // → bool
window.luneDrag = (on, vx, vy) => asistente.drag(!!on, vx, vy);
window.luneSleep = (on) => asistente.dormir(!!on);
window.luneTouch = () => asistente.tocar();
window.luneEncuadre = (m) => asistente.encuadrar(m);
window.luneCargarModelo = (url) => { window.luneReady = false; document.title = 'Lune VRM'; asistente.cargar(url); };
window.luneSetFPS = (n) => asistente.setFPS(n);
window.luneMeta = () => JSON.stringify(asistente.meta());
// Calibración del modelo (lista blanca de ui_web/vrm/lune_params.js) → JSON de lo aplicado.
// Si Python la llamó antes de que cargara este módulo, se aplica ahora la última.
const paramsPendientes = window.__luneParamsPendiente;
window.__luneParamsPendiente = null;
window.luneParams = (j) => asistente.luneParams(j);
if (paramsPendientes != null) asistente.luneParams(paramsPendientes);
// Bus de módulos del avatar (ui_web/vrm/lune_modulos.js): luneMod('baileProc', 'play', …).
window.luneMod = (nombre, metodo, ...args) => asistente.mod(nombre, metodo, ...args);
window.luneAsistente = asistente;                                    // para registrar módulos: luneAsistente.registrar(instalar)

// Cola de eventos hacia Python (lune_eventos.js; companion.py la vacía a 12 Hz). Si
// ese script no cargó, una cola vacía para que el sondeo no falle.
if (typeof window.luneEventos !== 'function') window.luneEventos = () => '[]';
// Efectos de sonido (lune_sfx.js); sin el script, no suena nada pero no rompe.
if (typeof window.luneSfx !== 'function') window.luneSfx = () => Promise.resolve(null);
// Tema de color (tema.js); sin el script, no cambia nada pero no rompe.
if (typeof window.luneTema !== 'function') window.luneTema = () => 0;

// Dónde está la cabeza, en px de la página → JSON {x, y, r} (o "null" sin modelo):
// el menú radial se ancla ahí (ui/companion.py → ancla_menu → mapToGlobal). Como
// la comida de Mate-Engine: hueso Head + (0, offsetY, 0) en SU espacio local (sigue
// a la cabeza si se inclina) proyectado con la cámara; el radio es 0.1·|escala del
// hueso| (0.1732 m con escala 1) medido sobre el eje derecho de la cámara.
window.luneCabeza = (offsetY = 0.1) => {
  try {
    const ctx = asistente.ctx, T = ctx && ctx.THREE, cab = ctx && ctx.huesos && ctx.huesos.head;
    if (!asistente.listo || !T || !cab || !ctx.camera || typeof ctx.proyectar !== 'function') return 'null';
    let oy = Number(offsetY);
    if (!Number.isFinite(oy)) oy = 0.1;
    cab.updateWorldMatrix(true, false);
    const centro = cab.localToWorld(new T.Vector3(0, oy, 0));
    const escala = cab.getWorldScale(new T.Vector3()).length() || Math.sqrt(3);
    ctx.camera.updateMatrixWorld();
    const derecha = new T.Vector3().setFromMatrixColumn(ctx.camera.matrixWorld, 0).normalize();
    const c = ctx.proyectar(centro.clone());
    const b = ctx.proyectar(centro.clone().addScaledVector(derecha, 0.1 * escala));
    const r = Math.hypot(b.x - c.x, b.y - c.y);
    if (![c.x, c.y, r].every(Number.isFinite)) return 'null';
    const d = (v) => Math.round(v * 10) / 10;
    return JSON.stringify({ x: d(c.x), y: d(c.y), r: d(r) });
  } catch (e) {
    return 'null';
  }
};

// Burbuja: la de lune_burbuja.js (temporizador compartido con comentarTipeado y el
// streaming). Mismo comportamiento que antes: comentar(t, ms = 14 s), pensando() '…'.
const burbuja = window.luneBurbuja;
if (burbuja) burbuja.onBoca = (on) => asistente.setHablando(!!on);   // la boca se mueve al teclear
window.comentar = (t, ms) => burbuja && burbuja.comentar(t, ms);
window.pensando = () => burbuja && burbuja.pensando();
window.ocultarBurbuja = () => burbuja && burbuja.ocultar();

// ── Cortes 5 y 6: pantalla grande (vrm/lune_grande.js) y baile (vrm/lune_baile_proc.js) ──
// Módulos opcionales del bus: si uno da 404 o no compila, esa función no hace nada.
// Se registran la primera vez que se usan (sin baile ni pantalla grande no cuestan nada).
const sinModulo = (nombre) => (e) => {
  try { console.warn(`[companion_vrm] sigo sin ${nombre}:`, (e && e.message) || e); } catch (_) { /* sin consola */ }
  return null;
};
// three-vrm también con import() tolerante (y como espacio de nombres): si no trae el
// colisionador, la página sigue y solo «sujetar el pelo» no hace nada.
const [modGrande, modBaile, VRMLib, modSentarse, modComida] = await Promise.all([
  import('./vrm/lune_grande.js').catch(sinModulo('lune_grande.js')),
  import('./vrm/lune_baile_proc.js').catch(sinModulo('lune_baile_proc.js')),
  import('@pixiv/three-vrm').catch(() => ({})),
  // Cortes 7 y 8 (sentarse y comida): igual de opcionales
  import('./vrm/lune_sentarse.js').catch(sinModulo('lune_sentarse.js')),
  import('./vrm/lune_comida.js').catch(sinModulo('lune_comida.js')),
]);
const pantalla = window.__lunePantalla || null;
const notas = window.LuneNotas ? window.LuneNotas.crear({ doc: document }) : null;
let modG = null, modB = null;
function moduloGrande() {
  if (!modG && modGrande && typeof modGrande.instalar === 'function') {
    modG = asistente.registrar((ctx) => modGrande.instalar(ctx, {
      VRMSpringBoneCollider: VRMLib && VRMLib.VRMSpringBoneCollider,
      VRMSpringBoneColliderShapeSphere: VRMLib && VRMLib.VRMSpringBoneColliderShapeSphere,
    }));
  }
  return modG;
}
function moduloBaile() {
  if (!modB && modBaile && typeof modBaile.instalar === 'function') {
    modB = asistente.registrar((ctx) => modBaile.instalar(ctx, { alGolpe: (e) => { if (notas) notas.golpe(e); } }));
  }
  return modB;
}
// fase: glide · entrar · salir · volver · fin (la ventana la mueve Python)
window.luneGrande = (fase, opts) => {
  if (pantalla) pantalla.fase(fase);
  const m = moduloGrande();
  return m ? !!m.api.fase(fase, opts) : false;
};
// Clic izquierdo mantenido en pantalla grande: el pelo se aparta del ratón
window.luneHold = (on, px, py) => (modG ? !!modG.api.hold(!!on, px, py) : false);
window.luneBailar = (on, opts) => {
  if (!on && notas) notas.limpiar();
  const m = on ? moduloBaile() : modB;
  return m ? !!m.api.bailar(!!on, opts || {}) : false;
};
window.lunePulso = (bpm, fase, energia) => (modB ? !!modB.api.pulso(bpm, fase, energia) : false);
// Lo que Python pidió mientras cargaba este módulo
const ocioPendiente = window.__luneOcioPendiente || {};
window.__luneOcioPendiente = null;
if (ocioPendiente.grande) window.luneGrande(...ocioPendiente.grande);
if (ocioPendiente.bailar) window.luneBailar(...ocioPendiente.bailar);
if (ocioPendiente.pulso) window.lunePulso(...ocioPendiente.pulso);

// ── Cortes 7 y 8: sentarse (vrm/lune_sentarse.js) y comida (vrm/lune_comida.js) ──
// También se registran la primera vez que se usan. El punto de asiento se puede medir
// sin registrar el módulo (medirAsiento con la pose que tenga).
let modS = null, modC = null;
function moduloSentarse() {
  if (!modS && modSentarse && typeof modSentarse.instalar === 'function') modS = asistente.registrar(modSentarse.instalar);
  return modS;
}
function moduloComida() {
  if (!modC && modComida && typeof modComida.instalar === 'function') modC = asistente.registrar(modComida.instalar);
  return modC;
}
const jsonPunto = (p) => (p ? JSON.stringify(p) : 'null');
// modo 'ventana' | 'barra' → JSON {asiento:{x,y}, sonda:{x,y}} (px de la página, pose
// sentada completa y encuadre de cuerpo entero); null → se levanta ('null').
window.luneSentar = (modo, variante) => {
  try {
    if (modo == null || modo === '') { if (modS) modS.api.levantar(); return 'null'; }
    const m = moduloSentarse();
    return m ? jsonPunto(m.api.sentar(modo, variante)) : 'null';
  } catch (e) { return 'null'; }
};
window.luneSeatPx = () => {
  try {
    if (modS) return jsonPunto(modS.api.puntos());
    return modSentarse && typeof modSentarse.medirAsiento === 'function' ? jsonPunto(modSentarse.medirAsiento(asistente.ctx)) : 'null';
  } catch (e) { return 'null'; }
};
window.luneComer = (tipo, ms) => { const m = moduloComida(); return m ? !!m.api.comer(tipo, ms) : false; };
window.luneComidaActiva = (on) => { const m = on ? moduloComida() : modC; return m ? !!m.api.activa(!!on) : false; };
const vidaPendiente = window.__luneVidaPendiente || {};
window.__luneVidaPendiente = null;
if (vidaPendiente.sentar) window.luneSentar(...vidaPendiente.sentar);
if (vidaPendiente.comida) window.luneComidaActiva(...vidaPendiente.comida);
if (vidaPendiente.comer) window.luneComer(...vidaPendiente.comer);

// ── Corte 9: reproductor de bailes MMD/VRMA (vrm/lune_mmd.js; lo pide ui/mmd_qt.ControlMMD) ──
// Se importa y se registra al pedir el primer baile (sin bailes no cuesta nada): lune_mmd.js,
// el parser VMD (lune_vmd.js), @pixiv/three-vrm-animation y el GLTFLoader, todos con import()
// tolerante (si falta uno, ese baile da error y la asistente sigue). La canción suena en esta
// página (lune_mmd_audio.js) y el módulo avisa con eventos 'mmd' por luneEventos. Mientras
// se importa, lo pedido se guarda (el último «cargar» y sus banderas) y se repite.
// Cuándo suena lo decide esta capa: el «cargar» va siempre sin autoplay y empieza al acabar
// de cargar si nadie pidió pausa entretanto (ventana oculta, juego): esa pausa no se pierde.
// Pausa → el módulo lleva a Lune al reposo, brazos abajo, en 0.6 s (D5); seguir → mismo t.
const ORDENES_MMD = ['cargar', 'pausa', 'parar', 'volumen', 'offset', 'en_sitio', 'bucle', 'estado'];
const mmdCola = { cargar: null, banderas: new Map() };
let modM = null, promMMD = null, quiereSonar = false, genMMD = 0;
const datosMMD = (o) => {
  if (typeof o !== 'string') return o;
  try { return JSON.parse(o); } catch (e) { return null; }
};
const valorMMD = (d, clave) => (d && typeof d === 'object' && !Array.isArray(d) ? d[clave] : d);
const emitirMMD = (datos) => { try { if (typeof window.luneEmitir === 'function') window.luneEmitir('mmd', datos); } catch (e) { /* sin cola */ } };
// Las órdenes van al api.orden del módulo (las de Python tal cual) salvo «cargar», que va sin
// autoplay y se pone a sonar aquí, y «seguir» con el baile listo, que es «reproducir».
function ordenMMD(mod, orden, o) {
  const api = mod.api, d = datosMMD(o);
  if (orden === 'estado') return JSON.stringify({ ...api.estado(), quiereSonar });
  if (orden === 'cargar') {
    if (!d || typeof d !== 'object' || Array.isArray(d)) return false;
    quiereSonar = d.autoplay !== false;
    const g = ++genMMD;
    Promise.resolve(api.orden('cargar', { ...d, autoplay: false })).then((ok) => {
      if (ok && g === genMMD && quiereSonar) api.orden('reproducir');
    }, () => { /* el módulo ya avisó con 'error' */ });
    return true;
  }
  if (orden === 'pausa') {
    const on = valorMMD(d, 'on');
    const fase = api.estado().fase;
    const quiere = on === true || on === false ? on : fase === 'sonando';
    quiereSonar = !quiere;
    if (!quiere && fase === 'listo') api.orden('reproducir');
    else api.orden('pausa', { on: quiere });
    return true;
  }
  if (orden === 'parar') { genMMD++; quiereSonar = false; return !!api.orden('parar'); }
  api.orden(orden, d);
  return true;
}
function importarMMD() {
  if (!promMMD) {
    promMMD = Promise.all([
      import('./vrm/lune_mmd.js').catch(sinModulo('lune_mmd.js')),
      import('./vrm/lune_vmd.js').catch(sinModulo('lune_vmd.js')),
      import('@pixiv/three-vrm-animation').catch(sinModulo('three-vrm-animation')),
      import('three/addons/loaders/GLTFLoader.js').catch(sinModulo('GLTFLoader.js')),
    ]).then(([m, vmd, vrma, gltf]) => {
      if (!m || typeof m.instalar !== 'function') return null;
      const V = vrma || {};
      modM = asistente.registrar((ctx) => m.instalar(ctx, {
        GLTFLoader: gltf && gltf.GLTFLoader, VRMAnimationLoaderPlugin: V.VRMAnimationLoaderPlugin,
        createVRMAnimationClip: V.createVRMAnimationClip, VRMAnimation: V.VRMAnimation,
        VRMLookAtQuaternionProxy: V.VRMLookAtQuaternionProxy, vmd: vmd || null, audio: window.LuneMMDAudio || null,
      })) || null;
      return modM;
    }, () => null);
  }
  return promMMD.then((mod) => {
    const cargar = mmdCola.cargar, banderas = [...mmdCola.banderas];
    mmdCola.cargar = null; mmdCola.banderas.clear();
    if (!mod) {
      const d = datosMMD(cargar);
      if (cargar) emitirMMD({ fase: 'error', id: String(valorMMD(d, 'id') || ''), mensaje: 'no se pudo cargar el reproductor de bailes' });
      return;
    }
    if (cargar) ordenMMD(mod, 'cargar', cargar);
    for (const [orden, o] of banderas) ordenMMD(mod, orden, o);
  });
}
// orden: cargar · pausa · parar · volumen · offset · en_sitio · bucle → bool; estado → JSON
window.luneMMD = (orden, o) => {
  try {
    orden = String(orden || '');
    if (!ORDENES_MMD.includes(orden)) return false;
    if (modM) return ordenMMD(modM, orden, o);
    if (orden === 'estado') return JSON.stringify({ fase: mmdCola.cargar ? 'cargando' : 'parado', pendiente: true });
    if (orden === 'cargar') { mmdCola.cargar = o; mmdCola.banderas.clear(); importarMMD(); }
    else if (orden === 'parar') { mmdCola.cargar = null; mmdCola.banderas.clear(); }
    else mmdCola.banderas.set(orden, o);
    return true;
  } catch (e) { return false; }
};
// Lo que Python pidió antes de que cargara este módulo (script clásico de arriba)
const mmdAntes = ocioPendiente.mmd;
if (mmdAntes && mmdAntes.cargar) {
  window.luneMMD('cargar', mmdAntes.cargar);
  for (const [orden, o] of mmdAntes.banderas || []) window.luneMMD(orden, o);
}
</script>
