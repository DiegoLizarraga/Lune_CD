<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{ margin:0; padding:28px; }
  .eyebrow{ font:var(--text-overline); letter-spacing:var(--ls-mega); text-transform:uppercase; color:var(--accent); margin:0 0 10px; }
  .hero{ font-family:var(--font-display); font-weight:700; font-size:58px; line-height:1.02; letter-spacing:.02em; text-transform:uppercase; color:var(--text-strong); margin:0; text-shadow:var(--text-glow-cyan); }
  .hero em{ font-style:normal; color:var(--cyan-500); }
  .sub{ font-family:var(--font-display); font-weight:600; font-size:24px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-muted); margin:14px 0 0; }
  .jp{ font-family:var(--font-jp); font-weight:900; color:var(--yellow-500); }
</style></head>
<body class="lune-backdrop">
  <p class="eyebrow">// Grind Fiction · Desktop AI</p>
  <h1 class="hero">Lune <em>CD</em> <span class="jp">ルネ</span></h1>
  <p class="sub">Asistente Híbrida · Nube / Local</p>
</body></html>
