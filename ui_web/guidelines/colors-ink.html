<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{ margin:0; padding:24px; }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .sw{ height:130px; border:var(--bw) solid var(--ink-500); padding:9px; display:flex; flex-direction:column; justify-content:flex-end; color:var(--gray-300); }
  .sw .n{ font-family:var(--font-display); font-weight:700; font-size:12px; }
  .sw .hex{ font:var(--text-data); font-size:9px; }
</style></head>
<body class="lune-backdrop">
  <div class="grid">
    <div class="sw" style="background:var(--ink-950)"><div class="n">950</div><div class="hex">#05070F</div></div>
    <div class="sw" style="background:var(--ink-900)"><div class="n">900</div><div class="hex">#080B16</div></div>
    <div class="sw" style="background:var(--ink-800)"><div class="n">800</div><div class="hex">#0F1424</div></div>
    <div class="sw" style="background:var(--ink-700)"><div class="n">700</div><div class="hex">#141B30</div></div>
    <div class="sw" style="background:var(--ink-600)"><div class="n">600</div><div class="hex">#1B2440</div></div>
    <div class="sw" style="background:var(--ink-500)"><div class="n">500</div><div class="hex">#232F52</div></div>
    <div class="sw" style="background:var(--ink-400)"><div class="n">400</div><div class="hex">#2E3D66</div></div>
  </div>
</body></html>
