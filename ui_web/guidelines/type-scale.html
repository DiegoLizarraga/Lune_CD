<!-- @dsCard group="Type" viewport="700x300" name="Type Scale" subtitle="Display → micro, with role + token" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{ margin:0; padding:24px; }
  .r{ display:flex; align-items:baseline; gap:16px; padding:7px 0; border-bottom:1px solid var(--ink-700); }
  .r:last-child{ border-bottom:none; }
  .s{ font-family:var(--font-display); font-weight:700; color:var(--text); text-transform:uppercase; letter-spacing:.02em; line-height:1; flex:1; }
  .meta{ font:var(--text-data); font-size:10px; color:var(--text-dim); text-align:right; white-space:nowrap; }
</style></head>
<body class="lune-backdrop">
  <div class="r"><span class="s" style="font-size:40px">Display</span><span class="meta">h1 · 40 / 700</span></div>
  <div class="r"><span class="s" style="font-size:30px">Title</span><span class="meta">h2 · 30 / 700</span></div>
  <div class="r"><span class="s" style="font-size:22px">Heading</span><span class="meta">h3 · 22 / 600</span></div>
  <div class="r"><span class="s" style="font-size:18px">Subhead</span><span class="meta">h4 · 18 / 600</span></div>
  <div class="r"><span class="s" style="font-size:15px; font-family:var(--font-sans); font-weight:400; text-transform:none; letter-spacing:0;">Body copy — Space Grotesk</span><span class="meta">body · 15 / 400</span></div>
  <div class="r"><span class="s" style="font-size:11px; font-family:var(--font-mono); font-weight:700; letter-spacing:.16em;">OVERLINE LABEL</span><span class="meta">overline · 11 / 700</span></div>
</body></html>
