<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Corte 9: fetch/XHR solo al servidor local de la asistente (y blob:/data:), como en
     companion_vrm.html. Si rompiera algo en pantalla, se quita. -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'self' blob: data:" />
<title>Lune</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="css/burbuja.css" />
<link rel="stylesheet" href="css/asistente_anim.css" />
<!-- Cortes 5 y 6: pantalla grande y salvapantallas, burbuja de alarma y notas del baile -->
<link rel="stylesheet" href="css/grande.css" />
<link rel="stylesheet" href="css/alarma.css" />
<link rel="stylesheet" href="css/baile.css" />
<!-- Cortes 7 y 8: apoyada en el borde de una ventana o de la barra (.lune-sentada) -->
<link rel="stylesheet" href="css/sentarse.css" />
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
    font-family:var(--font-body, system-ui, sans-serif); }
  #wrap { display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    height:100vh; gap:8px; padding:8px; box-sizing:border-box; }

  /* Burbuja de comentario (arriba de la asistente) */
  #bubble { max-width:230px; background:var(--ink-800,#0F1424); color:var(--paper,#EAF1FF);
    border:2px solid var(--cyan-700,#0091AB); border-radius:3px; clip-path:var(--clip-tr, none);
    padding:9px 12px; font-size:12.5px; line-height:1.38; box-shadow:0 6px 22px rgba(0,0,0,.55);
    opacity:0; transform:translateY(6px); transition:opacity .25s, transform .25s; pointer-events:none; }
  #bubble.on { opacity:1; transform:translateY(0); }
  #bubble .who { font-family:var(--font-mono, monospace); font-size:9px; letter-spacing:.12em;
    color:var(--cyan-400,#36ECFF); text-transform:uppercase; display:block; margin-bottom:3px; }
  #bubble .who .jp { color:var(--yellow-500,#FFE000); }

  /* Mini-stage con la asistente animada */
  #stage { position:relative; width:210px; height:290px; overflow:hidden;
    background:radial-gradient(circle at 50% 30%, rgb(var(--cyan-500-rgb, 0 229 255) / .16), transparent 62%), var(--ink-950,#05070F);
    border:2px solid var(--ink-500,#232F52); border-radius:7px;
    display:flex; align-items:flex-end; justify-content:center; }
  #stage video { height:97%; width:100%; object-fit:contain; object-position:bottom center; }
  #stage::after { content:""; position:absolute; inset:0; background:var(--tex-scanline, none);
    opacity:.45; pointer-events:none; }
</style>
</head>
<body class="lune-animada">
<div id="wrap">
  <div id="bubble"><span class="who"><span class="jp">月</span> Lune</span><span id="btxt"></span></div>
  <div id="stage"><video id="v" autoplay loop muted playsinline></video></div>
</div>
<!-- APIs compartidas con companion_vrm.html (scripts clásicos): cola de eventos hacia
     Python (luneEventos), efectos de sonido (luneSfx), packs de sonidos de reacción
     (luneSonidos; ui/companion.py le carga el pack al terminar la página) y la burbuja
     con máquina de escribir (comentarTipeado, burbujaTexto, burbujaFin, luneLado;
     también define comentar, pensando y ocultarBurbuja con un temporizador compartido).
     tema.js: window.luneTema(mapa|null), el tema de color (ui/companion.py → aplicar_tema). -->
<script src="lune_eventos.js"></script>
<script src="lune_sfx.js"></script>
<script src="lune_packs.js"></script>
<script src="lune_burbuja.js"></script>
<script src="tema.js"></script>
<!-- Cortes 5 y 6 (scripts clásicos, también en companion_vrm.html): reloj del pulso y
     notas ♪ (LuneRitmo, LuneNotas), burbuja de alarma (LuneAlarma) y salvapantallas /
     clase de pantalla grande (LunePantalla). -->
<script src="lune_ritmo.js"></script>
<script src="lune_alarma.js"></script>
<script src="lune_pantalla.js"></script>
<!-- Corte 9 (script clásico, también en companion_vrm.html): la canción de un baile en esta
     página, su reloj y el pulso (LuneMMDAudio). -->
<script src="lune_mmd_audio.js"></script>
<script>
  var V = 'assets/asistente/anime-videos/';
  // v10 — un estado por clip; los que aún no tienen video caen al idle.
  var MAP = { normal:'composed', thinking:'thinking', happy:'happy', angry:'angry', error:'angry',
              surprised:'surprised', nervous:'nervous', wave:'wave', dismiss:'dismiss',
              sad:'sad', curious:'curious', reading:'curious',
              typing:'working', listening:'listening', talking:'talking',
              laughing:'laughing', bored:'bored' };
  var vid = document.getElementById('v');

  function put(src) {
    if (vid.getAttribute('src') !== src) {
      vid.setAttribute('src', src);
      if (vid.load) vid.load();
      if (vid.play) vid.play().catch(function(){});
    }
  }
  // Respaldo de un solo <video> hasta que cargue el módulo de clips con doble búfer
  // (anim/lune_anim_video.js), que sustituye window.setEmocion y aplica la última
  // emoción pedida (__luneEmocionPendiente). Si el módulo no carga, sigue este.
  window.setEmocion = function (s) {
    window.__luneEmocionPendiente = s;
    var base = MAP[s] || 'composed';
    var src = V + 'lune-' + base + '.webm';
    var idle = V + 'lune-composed.webm';
    vid.onerror = function () { if (vid.getAttribute('src') !== idle) put(idle); };
    put(src);
  };

  // Burbuja: si lune_burbuja.js no cargó, la de siempre (sin máquina de escribir).
  if (!window.luneBurbuja) {
    var bub = document.getElementById('bubble');
    var btxt = document.getElementById('btxt');
    var bt = null;
    window.comentar = function (t) {
      if (!t) return;
      btxt.textContent = t;
      bub.classList.add('on');
      if (bt) clearTimeout(bt);
      bt = setTimeout(function () { bub.classList.remove('on'); }, 14000);
    };
    window.pensando = function () { btxt.textContent = '…'; bub.classList.add('on'); };
    window.ocultarBurbuja = function () { bub.classList.remove('on'); };
  }
  // Voz: la asistente de vídeo no tiene boca, pero la burbuja tiene que saber que suena
  // para no mover la boca al teclear cuando la haya (misma API que companion_vrm.html).
  // (corte 9: la canción de un baile baja al 35 % mientras habla: est.hablando del registro)
  window.luneSpeak = function (on) {
    if (window.luneBurbuja) window.luneBurbuja.setVoz(!!on);
    if (window.luneAnim && typeof window.luneAnim.estado === 'function') window.luneAnim.estado({ hablando: !!on });
  };
  // Cola de eventos y sonidos: respaldo mudo si sus scripts no cargaron.
  if (typeof window.luneEventos !== 'function') window.luneEventos = function () { return '[]'; };
  if (typeof window.luneSfx !== 'function') window.luneSfx = function () { return Promise.resolve(null); };
  // Tema de color (tema.js); sin el script, no cambia nada pero no rompe.
  if (typeof window.luneTema !== 'function') window.luneTema = function () { return 0; };

  // Dónde está la cabeza, en px de la página → JSON {x, y, r} (o "null"): el menú
  // radial se ancla ahí (ui/companion.py → ancla_menu). La animada no tiene huesos:
  // se calcula con la geometría del vídeo (720×1280, object-fit: contain pegado
  // abajo), con la cabeza medida en los clips: su base (el hueso Head de un VRM)
  // al 36 % del alto y centrada. `offsetY` son metros hacia arriba como en el VRM
  // (1 m ≈ 1.29 altos del vídeo; 0.1 → a la altura de la frente) y el radio es el
  // de la asistente 3D, 0.1732 m.
  window.luneCabeza = function (offsetY) {
    try {
      var oy = Number(offsetY === undefined ? 0.1 : offsetY);
      if (!isFinite(oy)) oy = 0.1;
      var el = document.getElementById('v');
      if (!el || typeof el.getBoundingClientRect !== 'function') return 'null';
      var r = el.getBoundingClientRect();
      if (!(r.width > 0 && r.height > 0)) return 'null';
      var vw = el.videoWidth > 0 ? el.videoWidth : 720, vh = el.videoHeight > 0 ? el.videoHeight : 1280;
      var s = Math.min(r.width / vw, r.height / vh);
      var cw = vw * s, ch = vh * s;
      var izq = r.left + (r.width - cw) / 2, arriba = r.top + (r.height - ch);   // contain, abajo al centro
      var M = 1.29;                                                              // altos del vídeo por metro
      var x = izq + 0.505 * cw, y = arriba + (0.36 - oy * M) * ch, radio = 0.1732 * M * ch;
      return JSON.stringify({ x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, r: Math.round(radio * 10) / 10 });
    } catch (e) { return 'null'; }
  };

  // Cortes 5 y 6 (ui/companion.py: set_salvapantallas, mostrar_alarma, grande_fase,
  // bailar, pulso). Salvapantallas y alarma son del DOM y van ya; pantalla grande y
  // baile son módulos del registro que pone el módulo de abajo: hasta entonces se
  // guarda la última llamada de cada una y el módulo la repite. luneHold (sujetar el
  // pelo) es solo del VRM: aquí no hace nada.
  window.__lunePantalla = window.LunePantalla ? window.LunePantalla.crear({ doc: document }) : null;
  window.__luneAlarmaUI = window.LuneAlarma ? window.LuneAlarma.crear({ doc: document }) : null;
  window.luneSalvapantallas = function (on, o) {
    var p = window.__lunePantalla;
    return p ? p.salvapantallas(!!on, o || {}) : false;
  };
  window.luneAlarma = function (texto, o) {
    var a = window.__luneAlarmaUI;
    if (!a) return false;
    return texto == null ? a.ocultar() : a.mostrar(String(texto), o || {});
  };
  window.__luneOcioPendiente = {};
  window.luneGrande = function (fase, o) {
    if (window.__lunePantalla) window.__lunePantalla.fase(fase);
    window.__luneOcioPendiente.grande = [fase, o];
    return false;
  };
  window.luneHold = function () { return false; };
  window.luneBailar = function (on, o) { window.__luneOcioPendiente.bailar = [on, o]; return false; };
  window.lunePulso = function (b, f, e) { window.__luneOcioPendiente.pulso = [b, f, e]; return false; };

  // Cortes 7 y 8 (ui/companion.py: asiento, punto_asiento, comer, set_comida_activa):
  // apoyada en el borde (anim/lune_anim_sentarse.js) y la reacción a la comida
  // (anim/lune_anim_comida.js). Hasta que carga el módulo se guarda la última llamada
  // y el módulo la repite; el punto de asiento es el centro de abajo del #stage.
  window.__luneVidaPendiente = {};
  window.luneSentar = function (modo, v) { window.__luneVidaPendiente.sentar = [modo, v]; return 'null'; };
  window.luneSeatPx = function () {
    try {
      var r = document.getElementById('stage').getBoundingClientRect();
      if (!(r.width > 0 && r.height > 0)) return 'null';
      var p = { x: Math.round((r.left + r.width / 2) * 10) / 10, y: Math.round((r.top + r.height) * 10) / 10 };
      return JSON.stringify({ asiento: p, sonda: p });
    } catch (e) { return 'null'; }
  };
  window.luneComer = function (tipo, ms) { window.__luneVidaPendiente.comer = [tipo, ms]; return false; };
  window.luneComidaActiva = function (on) { window.__luneVidaPendiente.comida = [on]; return false; };

  // Corte 9 (ui/companion.py: mmd), D1: la animada no tiene esqueleto. Con un baile de la
  // biblioteca suena su canción aquí y Lune baila «a su manera» (el baile procedural) al
  // pulso analizado de la canción (anim/lune_anim_mmd.js). Hasta que carga el módulo se
  // guarda el último «cargar» con las banderas que lleguen detrás; «parar» lo olvida todo.
  window.luneMMD = function (orden, o) {
    var p = window.__luneOcioPendiente;
    if (!p) return false;
    var m = p.mmd || (p.mmd = { cargar: null, banderas: [] });
    orden = String(orden || '');
    if (orden === 'estado') return JSON.stringify({ fase: m.cargar ? 'cargando' : 'parado', pendiente: true });
    if (orden === 'cargar') { m.cargar = o; m.banderas = []; return true; }
    if (orden === 'parar') { m.cargar = null; m.banderas = []; return true; }
    if (['pausa', 'volumen', 'offset', 'en_sitio', 'bucle'].indexOf(orden) < 0) return false;
    m.banderas = m.banderas.filter(function (b) { return b[0] !== orden; });
    m.banderas.push([orden, o]);
    return true;
  };

  window.setEmocion('wave');   // saluda al aparecer
</script>
<script type="module">
// Registro de módulos de la asistente animada (ui_web/anim/*.js): el equivalente del
// bus del VRM. El bucle arranca al registrarse el primer módulo y se pausa con la
// ventana oculta (luneSetFPS(0) desde Python). De serie:
//   'video'  (lune_anim_video.js)  clips con doble búfer y fundido, rotación de idles,
//            dormir (clip o sustituto) y capas de emoción de otros módulos;
//   'fisica' (lune_anim_fisica.js) arrastre con balanceo, toque, sueño y mareo.
// Sus eventos (arrastre {on}, dormir, despertar, mareo) van por ctx.emitir a la cola
// window.luneEventos (lune_eventos.js) que Python vacía a 12 Hz.
import { crearRegistroAnim } from './anim/lune_anim_modulos.js';
import { instalar as instalarVideo, publicar as publicarVideo } from './anim/lune_anim_video.js';
import { instalar as instalarFisica, publicar as publicarFisica } from './anim/lune_anim_fisica.js';

const stage = document.getElementById('stage');
const reg = crearRegistroAnim({
  stage,
  video: () => document.getElementById('v'),
  burbuja: document.getElementById('bubble'),
});
let visible = true;

const registrarBase = reg.registrar;
reg.registrar = (mod) => {
  const r = registrarBase(mod);
  if (r && visible && !reg.corriendo()) reg.iniciar();
  return r;
};

reg.registrar(instalarVideo);
reg.registrar(instalarFisica);
// window.setEmocion = (s) => reg.emocion(s): el módulo de vídeo pone el clip y todos
// los módulos se enteran (alEmocion); aplica la emoción pendiente del script clásico
// (el 'wave' del saludo). window.luneDrag / luneTouch / luneSleep → módulo 'fisica'.
publicarVideo(window, reg);
publicarFisica(window, reg);

window.luneAnim = reg;                                   // luneAnim.registrar(instalar), luneAnim.estado({...})
window.luneMod = (nombre, metodo, ...args) => reg.api(nombre, metodo, ...args);   // misma firma que en el VRM
window.luneSetFPS = (n) => {
  visible = Number(n) > 0;
  if (!visible) reg.detener();
  else if (reg.lista().length && !reg.corriendo()) reg.iniciar();
};

// ── Cortes 5 y 6: pantalla grande (anim/lune_anim_grande.js) y baile (anim/lune_anim_baile.js) ──
// Opcionales: si uno da 404 o no compila, esa función no hace nada. Se registran la
// primera vez que se usan (sin baile ni pantalla grande el registro sigue igual).
const sinModulo = (nombre) => (e) => {
  try { console.warn(`[companion] sigo sin ${nombre}:`, (e && e.message) || e); } catch (_) { /* sin consola */ }
  return null;
};
const [modGrande, modBaile, modSentarse, modComida, modMMDAnim] = await Promise.all([
  import('./anim/lune_anim_grande.js').catch(sinModulo('lune_anim_grande.js')),
  import('./anim/lune_anim_baile.js').catch(sinModulo('lune_anim_baile.js')),
  // Cortes 7 y 8 (apoyada en el borde y comida): igual de opcionales
  import('./anim/lune_anim_sentarse.js').catch(sinModulo('lune_anim_sentarse.js')),
  import('./anim/lune_anim_comida.js').catch(sinModulo('lune_anim_comida.js')),
  // Corte 9 (la canción de un baile y el baile a su manera al pulso): igual de opcional
  import('./anim/lune_anim_mmd.js').catch(sinModulo('lune_anim_mmd.js')),
]);
const pantalla = window.__lunePantalla || null;
const notas = window.LuneNotas ? window.LuneNotas.crear({ doc: document }) : null;
let modG = null, modB = null;
function moduloGrande() {
  if (!modG && modGrande && typeof modGrande.instalar === 'function') modG = reg.registrar(modGrande.instalar);
  return modG;
}
function moduloBaile() {
  if (!modB && modBaile && typeof modBaile.instalar === 'function') {
    modB = reg.registrar((ctx) => modBaile.instalar(ctx, { alGolpe: (e) => { if (notas) notas.golpe(e); } }));
  }
  return modB;
}
// fase: glide · entrar · salir · volver · fin (la ventana la mueve Python; el #stage
// crece por CSS con body.lune-grande)
window.luneGrande = (fase, opts) => {
  if (pantalla) pantalla.fase(fase);
  const m = moduloGrande();
  return m ? !!m.api.fase(fase, opts) : false;
};
// Baile: clip happy (capa 'baile') y movimiento al pulso sobre el #stage
window.luneBailar = (on, opts) => {
  if (!on && notas) notas.limpiar();
  const m = on ? moduloBaile() : modB;
  return m ? !!m.api.bailar(!!on, opts || {}) : false;
};
window.lunePulso = (bpm, fase, energia) => (modB ? !!modB.api.pulso(bpm, fase, energia) : false);
// Lo que Python pidió mientras cargaba este módulo
const ocioPendiente = window.__luneOcioPendiente || {};
window.__luneOcioPendiente = null;
if (ocioPendiente.grande) window.luneGrande(...ocioPendiente.grande);
if (ocioPendiente.bailar) window.luneBailar(...ocioPendiente.bailar);
if (ocioPendiente.pulso) window.lunePulso(...ocioPendiente.pulso);

// ── Cortes 7 y 8: apoyada en el borde (anim/lune_anim_sentarse.js) y comida
// (anim/lune_anim_comida.js), registrados la primera vez que se usan ──
let modS = null, modC = null;
function moduloSentarse() {
  if (!modS && modSentarse && typeof modSentarse.instalar === 'function') modS = reg.registrar(modSentarse.instalar);
  return modS;
}
function moduloComida() {
  if (!modC && modComida && typeof modComida.instalar === 'function') modC = reg.registrar(modComida.instalar);
  return modC;
}
const jsonPunto = (p) => (p ? JSON.stringify(p) : 'null');
const seatClasico = window.luneSeatPx;
window.luneSentar = (modo, variante) => {
  try {
    if (modo == null || modo === '') { if (modS) modS.api.levantar(); return 'null'; }
    const m = moduloSentarse();
    return m ? jsonPunto(m.api.sentar(modo, variante)) : 'null';
  } catch (e) { return 'null'; }
};
window.luneSeatPx = () => {
  try {
    if (modS) return jsonPunto(modS.api.puntos());
    if (modSentarse && typeof modSentarse.puntos === 'function') return jsonPunto(modSentarse.puntos(stage));
    return typeof seatClasico === 'function' ? seatClasico() : 'null';
  } catch (e) { return 'null'; }
};
window.luneComer = (tipo, ms) => { const m = moduloComida(); return m ? !!m.api.comer(tipo, ms) : false; };
window.luneComidaActiva = (on) => { const m = on ? moduloComida() : modC; return m ? !!m.api.activa(!!on) : false; };
const vidaPendiente = window.__luneVidaPendiente || {};
window.__luneVidaPendiente = null;
if (vidaPendiente.sentar) window.luneSentar(...vidaPendiente.sentar);
if (vidaPendiente.comida) window.luneComidaActiva(...vidaPendiente.comida);
if (vidaPendiente.comer) window.luneComer(...vidaPendiente.comer);

// ── Corte 9: bailes de la biblioteca en la animada (anim/lune_anim_mmd.js, D1) ──
// Se registra con el primer baile. La canción suena en esta página (LuneMMDAudio) y el baile
// es el de luneBailar/lunePulso (anim/lune_anim_baile.js) con el pulso de la canción a 2 Hz
// como mucho. Eventos 'mmd' como los del VRM (cargando, listo, sonando, pausado, t, fin,
// parado, error). Pausa → deja de bailar (reposo) y sigue desde el mismo punto.
let modMA = null;
function moduloMMD() {
  if (!modMA && modMMDAnim && typeof modMMDAnim.instalar === 'function') {
    modMA = reg.registrar((ctx) => modMMDAnim.instalar(ctx, {
      audio: window.LuneMMDAudio || null,
      bailar: (on, o) => window.luneBailar(on, o),
      pulso: (b, f, e) => window.lunePulso(b, f, e),
    }));
  }
  return modMA;
}
// orden: cargar · pausa · parar · volumen · offset · en_sitio · bucle → bool; estado → JSON
window.luneMMD = (orden, o) => {
  try {
    orden = String(orden || '');
    const m = orden === 'cargar' ? moduloMMD() : modMA;
    if (!m) {
      if (orden === 'estado') return JSON.stringify({ fase: 'parado' });
      if (orden === 'cargar') {
        let d = o;
        if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) { d = null; } }
        const id = d && typeof d === 'object' ? String(d.id || '') : '';
        if (typeof window.luneEmitir === 'function') window.luneEmitir('mmd', { fase: 'error', id, mensaje: 'no se pudo cargar el reproductor de bailes' });
        return false;
      }
      return orden === 'parar';
    }
    return typeof modMMDAnim.orden === 'function' ? modMMDAnim.orden(m.api, orden, o) : false;
  } catch (e) { return false; }
};
const mmdAntes = ocioPendiente.mmd;
if (mmdAntes && mmdAntes.cargar) {
  window.luneMMD('cargar', mmdAntes.cargar);
  for (const [orden, o] of mmdAntes.banderas || []) window.luneMMD(orden, o);
}
</script>
</body>
</html>
