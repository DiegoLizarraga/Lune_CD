<!-- @startingPoint section="Lune Desktop" subtitle="Full desktop AI-assistant shell — sidebar, chat, settings" viewport="1280x820" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lune CD · Desktop</title>
<!-- three.js y three-vrm para el avatar VRM de la barra lateral (vrm_barra.js). El
     importmap tiene que ir ANTES de cualquier <script type="module">; las rutas son
     relativas a esta página (ui_web/ui_kits/lune-desktop/ → ui_web/vendor/three/). -->
<script type="importmap">
{
  "imports": {
    "three": "../../vendor/three/three.module.min.js",
    "three/addons/": "../../vendor/three/",
    "@pixiv/three-vrm": "../../vendor/three/three-vrm.module.min.js"
  }
}
</script>
<link rel="stylesheet" href="../../styles.css" />
<!-- Las fuentes (también Exo 2 y JetBrains Mono del tema "Nube") van en local desde la 11.2:
     ui_web/fonts/ con sus @font-face en tokens/fonts.css. Sin peticiones a Google al arrancar. -->
<style>
  html, body { margin:0; height:100%; background:var(--ink-950); }
  #root { height:100vh; }

  /* ── APP SHELL ── */
  .ln-app{ display:flex; height:100vh; min-height:560px; overflow:hidden; position:relative; }
  .ln-sidebar{ z-index:2; }
  .ln-main{ flex:1; min-width:0; display:flex; flex-direction:column; position:relative; z-index:1; }

  /* ── ANIMATED BACKGROUND ── */
  .p3-bg{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .p3-bg::before{
    content:""; position:absolute; top:-56px; left:-56px; right:0; bottom:0;
    background:var(--tex-grid); background-size:var(--tex-grid-size); opacity:.55;
    animation:p3-grid 7s linear infinite;
  }
  @keyframes p3-grid{ from{ transform:translate(0,0); } to{ transform:translate(28px,28px); } }
  .p3-bg::after{
    content:""; position:absolute; inset:-30%;
    background:radial-gradient(600px 420px at 30% 70%, rgb(var(--blue-500-rgb, 30 85 255) / .14), transparent 60%),
               radial-gradient(520px 380px at 75% 25%, rgb(var(--cyan-500-rgb, 0 229 255) / .10), transparent 60%);
    animation:p3-bloom 18s var(--ease-out) infinite alternate;
  }
  @keyframes p3-bloom{ from{ transform:translate(-3%,2%) scale(1); } to{ transform:translate(3%,-3%) scale(1.12); } }
  .p3-shard{
    position:absolute; bottom:-160px; opacity:0;
    clip-path:polygon(50% 0, 100% 32%, 82% 100%, 12% 88%);
    animation-name:p3-shard; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes p3-shard{
    0%{ transform:translateY(0) rotate(0) skewX(-8deg); opacity:0; }
    8%{ opacity:var(--o); }
    88%{ opacity:var(--o); }
    100%{ transform:translateY(-118vh) rotate(200deg) skewX(-8deg); opacity:0; }
  }

  /* ── SIDEBAR ── */
  .ln-sidebar{
    position:relative; width:var(--app-sidebar); flex:none;
    background:var(--ink-850); border-right:var(--bw) solid var(--border-strong);
    display:flex; flex-direction:column; gap:12px; padding:18px 14px 14px; overflow-y:auto;
  }
  .ln-brand{ display:flex; align-items:center; gap:11px; }
  .ln-brand-mark{ width:42px; height:42px; flex:none; display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--yellow-500); background:var(--ink-950); border:var(--bw-bold) solid var(--cyan-700); clip-path:var(--clip-tr); }
  .ln-brand-name{ font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:.04em; color:var(--text-strong); line-height:1; }
  .ln-brand-name span{ color:var(--cyan-500); }
  .ln-brand-sub{ font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; color:var(--text-faint); text-transform:uppercase; margin-top:4px; }
  .ln-brand-sub .lune-jp{ color:var(--yellow-500); }

  .ln-sec-label{ font:var(--text-overline); letter-spacing:var(--ls-mega); color:var(--text-faint); text-transform:uppercase; padding-left:4px; }
  .ln-providers{ display:flex; flex-direction:column; gap:7px; }
  .ln-providers .lune-provtab-tx{ min-width:0; }
  .ln-providers .lune-provtab-desc{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Tercer proveedor: API compatible con OpenAI (acento amarillo; el DS solo trae cian y azul). */
  .lune-provtab.is-active.accent-yellow{ background:rgb(var(--yellow-500-rgb, 255 224 0) / .08); border-color:var(--yellow-600); color:var(--yellow-300); }
  .lune-provtab.is-active.accent-yellow .lune-provtab-ic{ background:var(--yellow-500); color:var(--ink-950); border-color:var(--yellow-400); }
  .lune-provtab.is-active.accent-yellow .lune-provtab-name{ color:var(--yellow-300); }
  .lune-provtab.is-active.accent-yellow .lune-provtab-led{ background:var(--yellow-500); }
  /* Tareas (10.9): acceso siempre a la vista con las pendientes de hoy (sidebar.jsx → vista «tareas»). */
  .ln-tareas-acc{ position:relative; display:flex; align-items:center; gap:11px; width:100%; padding:10px 12px; cursor:pointer; text-align:left;
    background:var(--ink-800); border:var(--bw) solid var(--ink-500); color:var(--text-muted); clip-path:var(--clip-tr);
    transition:transform var(--dur-fast) var(--ease-snap), background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast); }
  .ln-tareas-acc:hover{ background:var(--ink-700); color:var(--text); transform:translateX(5px) skewX(-3deg); }
  .ln-tareas-acc.is-active{ background:rgb(var(--yellow-500-rgb, 255 224 0) / .08); border-color:var(--yellow-600); color:var(--yellow-300); }
  .ln-tareas-acc-ic{ width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--ink-700);
    border:var(--bw) solid var(--border-strong); clip-path:var(--clip-tr); color:var(--cyan-400); }
  .ln-tareas-acc.is-active .ln-tareas-acc-ic{ background:var(--yellow-500); color:var(--ink-950); border-color:var(--yellow-400); }
  .ln-tareas-acc-tx{ display:flex; flex-direction:column; gap:1px; min-width:0; }
  .ln-tareas-acc-nom{ font-family:var(--font-display); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.03em; }
  .ln-tareas-acc-desc{ font-family:var(--font-mono); font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ln-tareas-acc-num{ margin-left:auto; flex:none; min-width:24px; height:24px; padding:0 6px; display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; font-size:12px; color:var(--text-dim); background:var(--ink-950); border:var(--bw) solid var(--ink-500);
    clip-path:var(--clip-tr); }
  .ln-tareas-acc.has-pend .ln-tareas-acc-num{ background:var(--yellow-500); color:var(--ink-950); border-color:var(--yellow-400);
    box-shadow:0 0 12px rgb(var(--yellow-500-rgb, 255 224 0) / .35); }

  .ln-asistente{ flex:1; min-height:0; display:flex; flex-direction:column; justify-content:flex-end; }
  .ln-asistente-stage{
    /* Los clips de la asistente son 9:16 (720×1280): el stage toma esa misma proporción
       para que el video lo llene entero, sin banda vacía arriba. */
    position:relative; width:100%; aspect-ratio:9/16; height:auto; max-height:520px; min-height:150px; background:
      radial-gradient(circle at 50% 32%, rgb(var(--cyan-500-rgb, 0 229 255) / .12), transparent 62%),
      var(--ink-950);
    border:var(--bw) solid var(--ink-500); clip-path:var(--clip-notch);
    display:flex; align-items:flex-end; justify-content:center; overflow:hidden;
  }
  .ln-asistente-stage::after{ display:none; }
  .ln-asistente-stage::after{ content:""; position:absolute; inset:0; background:var(--tex-scanline); pointer-events:none; }
  .ln-asistente-stage img, .ln-asistente-stage video{ height:100%; width:100%; object-fit:cover; object-position:center bottom; }
  /* Avatar VRM 3D en la barra (vrm_barra.js). Con Lune fuera se pausa y se oculta. */
  .ln-asistente-stage canvas.ln-asistente-vrm{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:pointer; }
  .ln-asistente-stage.is-out canvas.ln-asistente-vrm{ visibility:hidden; pointer-events:none; }
  .ln-asistente-tag{ display:none; }
  /* Lune fuera (asistente en escritorio): el escenario no la dibuja dos veces */
  .ln-asistente-stage.is-out{ align-items:center; border-style:dashed; background:
      repeating-linear-gradient(135deg, rgb(var(--cyan-500-rgb, 0 229 255) / .05) 0 10px, transparent 10px 22px), var(--ink-950); }
  .ln-asistente-out{ display:flex; flex-direction:column; align-items:center; gap:8px; padding:18px 14px; text-align:center; }
  .ln-asistente-out-jp{ font-size:38px; color:var(--yellow-500); opacity:.85; filter:drop-shadow(0 0 10px rgb(var(--yellow-500-rgb, 255 224 0) / .35)); }
  .ln-asistente-out-t{ font-family:var(--font-display); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-strong); }
  .ln-asistente-out-d{ font-family:var(--font-mono); font-size:10px; line-height:1.45; color:var(--text-dim); }
  .ln-asistente-out-btn{ margin-top:6px; cursor:pointer; border:var(--bw) solid var(--cyan-700); background:var(--ink-800); color:var(--cyan-400);
      font-family:var(--font-display); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.06em; padding:8px 12px; clip-path:var(--clip-tr);
      transition:background var(--dur-fast), color var(--dur-fast); }
  .ln-asistente-out-btn:hover{ background:var(--cyan-700); color:var(--ink-950); }
  /* Selector de modelo 3D por personaje (panel Personajes) */
  .ln-vrm-pick{ display:flex; flex-direction:column; gap:5px; min-width:220px; }
  .ln-vrm-pick .lune-input{ height:36px; padding:6px 10px; font-size:12px; }

  .ln-telegram{
    display:flex; align-items:center; gap:9px; width:100%; cursor:pointer;
    font-family:var(--font-display); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em;
    color:var(--blue-300); background:var(--ink-800); border:var(--bw) solid var(--blue-700);
    padding:10px 12px; clip-path:var(--clip-tr);
    transition:background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast);
  }
  .ln-telegram:hover{ background:rgb(var(--blue-500-rgb, 30 85 255) / .14); }
  .ln-telegram.is-on{ background:var(--blue-600); border-color:var(--blue-400); color:var(--white); }
  .ln-tg-led{ margin-left:auto; width:8px; height:8px; border-radius:50%; background:var(--cyan-400); box-shadow:var(--glow-cyan-sm); }

  .ln-divider{ height:var(--bw); background:var(--border); }

  /* ── MENÚ BUTTON (P3R trigger) ── */
  .p3-menubtn{
    position:relative; cursor:pointer; height:36px; padding:0 22px 0 16px; border:none;
    background:var(--yellow-500); color:var(--ink-950);
    font-family:var(--font-display); font-weight:700; font-style:italic; font-size:14px;
    text-transform:uppercase; letter-spacing:.08em;
    clip-path:polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%);
    transition:transform var(--dur-fast) var(--ease-snap), background var(--dur-fast);
  }
  .p3-menubtn:hover{ background:var(--cyan-500); transform:skewX(-6deg) scale(1.06); }
  .p3-menubtn:active{ transform:skewX(-6deg) scale(.97); }

  /* ── COMMAND MENU OVERLAY (Persona 3 Reload style) ── */
  .p3-overlay{
    position:fixed; inset:0; z-index:var(--z-overlay); overflow:hidden; cursor:pointer;
    background:
      radial-gradient(1100px 700px at 78% 18%, rgb(var(--cyan-500-rgb, 0 229 255) / .20), transparent 60%),
      linear-gradient(155deg, var(--blue-700) 0%, var(--ink-900) 55%, var(--ink-950) 100%);
    animation:p3-fade var(--dur) var(--ease-out);
  }
  @keyframes p3-fade{ from{ opacity:0; } to{ opacity:1; } }
  .p3-slash-bg{
    position:absolute; inset:0; background:var(--paper);
    clip-path:polygon(0 0, 38% 0, 20% 100%, 0 100%);
    animation:p3-slash .45s var(--ease-snap);
  }
  @keyframes p3-slash{ from{ transform:translateX(-100%); } to{ transform:translateX(0); } }
  .p3-bigword{
    position:absolute; left:6%; bottom:-8%; z-index:1; pointer-events:none;
    font-family:var(--font-jp); font-weight:900; font-size:34vh; line-height:.9; letter-spacing:-.02em;
    color:var(--ink-950); opacity:.35; transform:rotate(-7deg) skewX(-6deg);
    animation:p3-word .6s var(--ease-out);
  }
  @keyframes p3-word{ from{ opacity:0; transform:rotate(-7deg) skewX(-6deg) translateY(60px); } to{ opacity:.35; transform:rotate(-7deg) skewX(-6deg) translateY(0); } }
  .p3-asistente{
    position:absolute; left:2%; bottom:0; height:88%; z-index:2; pointer-events:none;
    filter:drop-shadow(10px 10px 0 rgb(var(--cyan-500-rgb, 0 229 255) / .55));
    animation:p3-asistente .5s var(--ease-snap);
  }
  @keyframes p3-asistente{ from{ opacity:0; transform:translateX(-70px) rotate(-3deg); } to{ opacity:1; transform:translateX(0) rotate(0); } }
  .p3-word-vert{
    position:absolute; top:4%; left:36%; z-index:1; pointer-events:none;
    font-family:var(--font-display); font-weight:700; font-style:italic; font-size:11vh;
    letter-spacing:.05em; color:transparent; -webkit-text-stroke:2px rgba(234,241,255,.16);
    transform:rotate(90deg); transform-origin:left top;
  }
  .p3-list{
    position:absolute; top:46%; left:56%; transform:translate(-30%,-50%);
    display:flex; flex-direction:column; gap:2px; z-index:3; cursor:default;
  }
  .p3-item{
    position:relative; display:flex; align-items:center; gap:14px; border:none; background:transparent;
    cursor:pointer; padding:1px 18px; width:max-content;
    font-family:var(--font-display); font-weight:700; font-style:italic; font-size:30px;
    text-transform:uppercase; letter-spacing:.02em; line-height:1.12; color:var(--c); white-space:nowrap;
    text-shadow:3px 3px 0 rgba(5,7,15,.85);
    transform:skewX(-10deg) rotate(-2deg);
    opacity:0; animation:p3-item-in .38s var(--ease-snap) forwards;
    animation-delay:calc(var(--i) * 42ms);
    transition:transform var(--dur-fast) var(--ease-snap), color var(--dur-fast), font-size var(--dur-fast) var(--ease-snap);
  }
  @keyframes p3-item-in{ from{ opacity:0; transform:translateX(140px) skewX(-18deg) rotate(-2deg); } to{ opacity:1; transform:translateX(0) skewX(-10deg) rotate(-2deg); } }
  .p3-item.is-active{
    color:var(--ink-950); font-size:44px; text-shadow:none; z-index:4;
    transform:translateX(-14px) skewX(-10deg) rotate(-2deg) scale(1.04);
  }
  .p3-item.is-active::before{
    content:""; position:absolute; inset:-4px -26px -4px -14px; z-index:-1;
    background:var(--yellow-500);
    clip-path:polygon(3% 12%, 100% 0, 94% 88%, 0 100%);
    box-shadow:6px 6px 0 rgb(var(--cyan-500-rgb, 0 229 255) / .75);
    animation:p3-flash .18s var(--ease-snap);
  }
  @keyframes p3-flash{ from{ transform:scaleX(.6); opacity:0; } to{ transform:scaleX(1); opacity:1; } }
  .p3-item.is-danger.is-active::before{ background:var(--red-500); }
  .p3-item.is-danger.is-active{ color:var(--white); }
  .p3-item-led{ width:11px; height:11px; border-radius:50%; background:var(--gray-600); flex:none; }
  .p3-item-led.on{ background:var(--cyan-400); box-shadow:0 0 10px rgb(var(--cyan-500-rgb, 0 229 255) / .8); }
  .p3-item.is-active .p3-item-led{ border:2px solid var(--ink-950); }
  .p3-cmdinfo{
    position:absolute; right:34px; bottom:28px; z-index:3; text-align:right; cursor:default;
    animation:p3-fade .4s var(--ease-out);
  }
  .p3-cmdinfo-name{ font-family:var(--font-display); font-weight:700; font-style:italic; font-size:26px; text-transform:uppercase; color:var(--paper); }
  .p3-cmdinfo-line{ font-family:var(--font-mono); font-weight:700; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan-400); margin:2px 0 4px; }
  .p3-cmdinfo-desc{ font-family:var(--font-sans); font-size:13px; color:var(--text-muted); max-width:260px; }
  .p3-cmdinfo-keys{ margin-top:12px; font-family:var(--font-mono); font-size:11px; color:var(--text-dim); }
  .p3-cmdinfo-keys b{ color:var(--ink-950); background:var(--paper); padding:2px 7px; font-style:normal; clip-path:var(--clip-tr); }

  /* ── TOPBAR ── */
  .ln-topbar{
    position:relative; z-index:5;
    height:var(--app-topbar); flex:none; display:flex; align-items:center; gap:10px; padding:0 20px;
    background:var(--ink-850); border-bottom:var(--bw) solid var(--border-strong);
  }
  .ln-topbar-ic{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:var(--bw) solid var(--border-strong); clip-path:var(--clip-tr); }
  .ln-topbar-ic.local{ color:var(--cyan-500); background:rgb(var(--cyan-500-rgb, 0 229 255) / .08); border-color:var(--cyan-700); }
  .ln-topbar-ic.cloud{ color:var(--blue-400); background:rgb(var(--blue-500-rgb, 30 85 255) / .10); border-color:var(--blue-600); }
  .ln-topbar-ic.compat{ color:var(--yellow-500); background:rgb(var(--yellow-500-rgb, 255 224 0) / .08); border-color:var(--yellow-600); }
  .ln-topbar-title{ font-family:var(--font-display); font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-strong); white-space:nowrap; }
  .ln-topbar-desc{ font-family:var(--font-mono); font-size:11px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ln-topbar-tx{ display:flex; align-items:baseline; gap:8px; min-width:0; overflow:hidden; }
  .ln-topbar-right{ margin-left:auto; display:flex; align-items:center; gap:8px; }

  /* ── CHAT STREAM ── */
  .ln-stream{ flex:1; min-height:0; overflow-y:auto; padding:22px; }
  .ln-stream-inner{ max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:6px; }
  .ln-stream::-webkit-scrollbar{ width:9px; }
  .ln-stream::-webkit-scrollbar-thumb{ background:var(--ink-500); }
  .ln-stream::-webkit-scrollbar-track{ background:var(--ink-900); }

  /* tool card */
  .ln-toolrow{ display:flex; padding:6px 4px 6px 49px; }
  .ln-toolcard{ width:100%; padding:14px 16px !important; }
  .ln-tool-head{ display:flex; align-items:center; gap:9px; }
  .ln-tool-ic{ width:30px; height:30px; flex:none; display:flex; align-items:center; justify-content:center; background:var(--cyan-500); color:var(--ink-950); clip-path:var(--clip-tr); }
  .ln-tool-title{ font-family:var(--font-display); font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.03em; color:var(--text-strong); }
  .ln-tool-flag{ margin-left:auto; font-family:var(--font-mono); font-weight:700; font-size:10px; letter-spacing:.08em; color:var(--cyan-400); }
  .ln-tool-detail{ margin:9px 0 0; font-family:var(--font-mono); font-size:12px; line-height:1.5; color:var(--text-muted); }

  /* typing */
  .ln-typing{ display:flex; gap:11px; padding:6px 4px; align-items:flex-end; }
  .ln-typing-bubble{ display:flex; gap:6px; align-items:center; padding:14px 16px; background:var(--ink-800); border:var(--bw) solid var(--border-strong); border-left:var(--bw-bold) solid var(--cyan-700); clip-path:polygon(0 0,100% 0,100% 100%,11px 100%,0 calc(100% - 11px)); }
  .ln-dot{ width:7px; height:7px; background:var(--cyan-500); animation:ln-blink 1.1s infinite; }
  .ln-dot:nth-child(2){ animation-delay:.18s; } .ln-dot:nth-child(3){ animation-delay:.36s; }
  @keyframes ln-blink{ 0%,60%,100%{ opacity:.25; transform:translateY(0); } 30%{ opacity:1; transform:translateY(-3px); } }
  @media (prefers-reduced-motion: reduce){ .ln-dot{ animation:none; opacity:.7; } }

  /* ── P3R VIEW TRANSITIONS ── */
  .ln-view{ flex:1; min-height:0; display:flex; flex-direction:column; position:relative; overflow:hidden; animation:p3-view .42s var(--ease-snap); }
  @keyframes p3-view{ from{ opacity:0; transform:translateX(46px) skewX(-3deg); } to{ opacity:1; transform:translateX(0) skewX(0); } }
  .ln-view::before{
    content:""; position:absolute; inset:-20% -10%; z-index:60; pointer-events:none;
    background:linear-gradient(105deg, transparent 34%, rgba(234,241,255,.85) 46%, rgb(var(--cyan-500-rgb, 0 229 255) / .9) 52%, transparent 64%);
    transform:translateX(-130%) skewX(-8deg);
    animation:p3-sweep .55s var(--ease-snap) forwards;
  }
  @keyframes p3-sweep{ to{ transform:translateX(130%) skewX(-8deg); } }

  /* ── P3R MICRO-INTERACTIONS ── */
  .ln-stream-inner .lune-msg{ animation:p3-msg-l .3s var(--ease-snap) backwards; }
  .ln-stream-inner .lune-msg.is-user{ animation-name:p3-msg-r; }
  @keyframes p3-msg-l{ from{ opacity:0; transform:translateX(-34px) skewX(4deg); } to{ opacity:1; transform:none; } }
  @keyframes p3-msg-r{ from{ opacity:0; transform:translateX(34px) skewX(-4deg); } to{ opacity:1; transform:none; } }
  .lune-bubble{ transition:transform var(--dur-fast) var(--ease-snap); }

  .ln-welcome-mark{ flex:none; width:clamp(110px, 24vh, 170px); height:clamp(110px, 24vh, 170px); position:relative; border:var(--bw-bold) solid var(--ink-500); clip-path:var(--clip-notch); overflow:hidden; background:radial-gradient(circle at 50% 35%, rgb(var(--cyan-500-rgb, 0 229 255) / .14), transparent 62%), var(--ink-950); display:flex; align-items:flex-end; justify-content:center; margin-bottom:6px; }

  /* ═══════════ TEMA "NUBE" — se activa con Lune AI · Nube (cielo nocturno con nubecitas) ═══════════ */

  /* Hero "LUNE ENTRE NUBES" (estado vacío del chat en modo Nube) */

  .ln-settings{ position:relative; flex:1; min-height:0; overflow-y:auto; padding:26px;
    background:
      radial-gradient(1.3px 1.3px at 12% 18%, rgba(234,241,255,.9) 50%, transparent 51%),
      radial-gradient(1px 1px at 34% 62%, rgba(234,241,255,.7) 50%, transparent 51%),
      radial-gradient(1.6px 1.6px at 58% 30%, rgb(var(--cyan-300-rgb, 125 245 255) / .8) 50%, transparent 51%),
      radial-gradient(1px 1px at 76% 74%, rgba(234,241,255,.6) 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 88% 14%, rgb(var(--yellow-500-rgb, 255 224 0) / .7) 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 86%, rgb(var(--cyan-300-rgb, 125 245 255) / .6) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 66% 92%, rgba(234,241,255,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 46% 8%, rgba(234,241,255,.75) 50%, transparent 51%),
      radial-gradient(700px 380px at 50% -10%, rgb(var(--yellow-500-rgb, 255 224 0) / .10), transparent 62%),

  }
  .p5-moonfield{ position:fixed; inset:var(--app-topbar) 0 0 0; pointer-events:none; z-index:0; overflow:hidden; }
  .p5-moon, .p5-star{ position:absolute; top:0; display:block; background:var(--yellow-500); opacity:0;
    animation-name:p5-fall; animation-timing-function:linear; animation-iteration-count:infinite;
    filter:drop-shadow(0 0 6px rgb(var(--yellow-500-rgb, 255 224 0) / .45));
  }
  .p5-moon{ border-radius:50%; -webkit-mask:radial-gradient(circle at 70% 30%, transparent 54%, #000 56%); mask:radial-gradient(circle at 70% 30%, transparent 54%, #000 56%); }

  @keyframes p5-fall{
    0%{ transform:translateY(-12vh) rotate(0deg); opacity:0; }
    6%{ opacity:var(--o); }
    90%{ opacity:var(--o); }
    100%{ transform:translateY(112vh) rotate(210deg); opacity:0; }

  /* corner clusters — twinkle in place */
  .p5-fix{ animation-name:p5-twinkle; animation-duration:4s; animation-timing-function:ease-in-out; animation-iteration-count:infinite; animation-direction:alternate; opacity:.85; filter:drop-shadow(0 0 10px rgb(var(--yellow-500-rgb, 255 224 0) / .55)); }
  @keyframes p5-twinkle{ from{ transform:rotate(var(--r,0deg)) scale(.88); opacity:.6; } to{ transform:rotate(var(--r,0deg)) scale(1.06); opacity:.95; } }

  .p5-horizon{ position:absolute; left:50%; bottom:-40vh; width:170%; height:62vh; transform:translateX(-50%); border-radius:50% 50% 0 0 / 100% 100% 0 0;

  }

  @keyframes p5-bob{ from{ transform:rotate(-2deg) translateY(0); } to{ transform:rotate(-1deg) translateY(-7px); } }

  .fx-no-bg .p5-moonfield{ display:none; }

  /* ── PANELES DE DATOS (Personajes · Memoria · Historial · Optimizar) ── */
  .ln-empty{ font:var(--text-data); font-size:13px; color:var(--text-dim); padding:22px 4px; }
  .ln-panel-desc{ margin:0; font:var(--text-body); font-size:13px; color:var(--text-muted); line-height:1.5; }
  .ln-panel-meta{ margin-top:6px; font:var(--text-data); font-size:11px; color:var(--text-faint); letter-spacing:.04em; }
  .ln-badge-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .ln-stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px; }
  .ln-proc-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:var(--bw) solid var(--border); }
  .ln-proc-row:last-child{ border-bottom:none; }
  .ln-proc-name{ font:var(--text-data); font-size:12px; color:var(--text-strong); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ln-panel-foot{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px; }

  /* ── Adjuntos + toast ── */
  .ln-inputbar-wrap{ flex:none; }
  .ln-attach-row{ display:flex; flex-wrap:wrap; gap:6px; padding:8px 20px 0; }
  .ln-attach-chip{ max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ln-toast{
    position:absolute; left:50%; bottom:104px; transform:translateX(-50%); z-index:20;
    font:var(--text-data); font-size:12px; letter-spacing:.03em; color:var(--ink-950);
    background:var(--cyan-500); border:var(--bw-bold) solid var(--cyan-700);
    padding:9px 16px; clip-path:var(--clip-tr); box-shadow:var(--shadow-hard); max-width:70%;
    animation:ln-toast-in .2s ease both;
  }
  @keyframes ln-toast-in{ from{ opacity:0; transform:translate(-50%,8px); } to{ opacity:1; transform:translate(-50%,0); } }

  /* ── MODO JUEGO (clase en <body> por la señal juego_estado): nada se anima ni repinta mientras
     juegas. Las animaciones acaban al instante y no se repiten: las de entrada quedan en su estado
     final (visibles) y el fondo, quieto. El avatar 3D y el vídeo de la barra se pausan en sidebar.jsx. ── */
  body.modo-juego *, body.modo-juego *::before, body.modo-juego *::after{
    animation-duration:0s !important; animation-delay:0s !important; animation-iteration-count:1 !important; transition:none !important; }

  /* ── LUNE EN REPOSO (clase en <body> que pone ui_web/lune_reposo.js: sin foco 20 s o sin usarla 90 s).
     En QtWebEngine cada frame de Chromium pasa por Qt: con una sola animación infinita viva (el fondo,
     las nubes, el LED) la ventana a la vista gasta de 1 a 3 núcleos sin que nadie la use. Todo se
     congela sin saltos y, al volver, sigue donde estaba. El vídeo y el avatar 3D de la barra se pausan
     en sidebar.jsx. Lo que aparece mientras tanto se ve en su estado final (lune_reposo.js). ── */
  body.lune-quieta *, body.lune-quieta *::before, body.lune-quieta *::after{ animation-play-state:paused !important; }
</style>
</head>
<body>
  <div id="root"></div>
  <template id="__bundler_thumbnail">

  <!-- React, ReactDOM y Babel van EN LOCAL (ui_web/vendor, mismos bytes que el CDN:
       los hashes SRI coinciden). Así Lune abre sin internet y no espera 3 MB del
       CDN en cada arranque. Si alguien borra vendor/, se cae al CDN.
       Desde la 11.2, React en su build de PRODUCCIÓN (cada render cuesta de 2 a 5 veces
       menos que el de desarrollo; el chat se vuelve a pintar con cada trozo de respuesta).
       Para depurar la interfaz con los avisos de React, cambia estas dos líneas a
       vendor/react.development.js y vendor/react-dom.development.js (siguen ahí).
       El instalador (packaging/compilar_web.mjs) además traduce los .jsx al construir
       y no carga Babel. -->
  <script src="../../vendor/react.production.min.js"></script>
  <script>window.React || document.write('<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"><\/script>');</script>
  <script src="../../vendor/react-dom.production.min.js"></script>
  <script>window.ReactDOM || document.write('<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"><\/script>');</script>
  <script src="../../vendor/babel.min.js"></script>
  <script>window.Babel || document.write('<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"><\/script>');</script>
  <script src="../../_ds_bundle.js"></script>
  <script>window.LUNE = window.LuneCDShibuyaPunkDesignSystem_8598db;</script>
  <!-- Tema de color (corte 4): window.luneTema(mapa|json|null) redefine los tokens (cian, azul y, si se
       pide, amarillo y fondos) con el mapa que calcula Python (nucleo/tema.py). -->
  <script src="../../tema.js"></script>
  <!-- «Lune en reposo» (11.2): body.lune-quieta sin foco 20 s o sin usarla 90 s; window.luneFoco(bool) lo
       llama ui/web_shell.py y window.LuneReposo lo usa app.jsx (ocupada escribiendo o hablando, y la barra). -->
  <script src="../../lune_reposo.js"></script>
  <!-- Efectos de sonido (WebAudio): sonidos del menú radial SVG y «Escuchar» de los packs. -->
  <script src="../../lune_sfx.js"></script>
  <!-- Ritmo (cortes 5/6): LuneRitmo (reloj del pulso) y LuneNotas (notas ♪), script clásico en globalThis. -->
  <script src="../../lune_ritmo.js"></script>
  <!-- Puente al backend de Lune (solo dentro de la app; en el navegador queda inactivo). -->
  <script src="../../qwebchannel.js"></script>
  <script>
    if (window.qt && window.qt.webChannelTransport) {
      new QWebChannel(qt.webChannelTransport, function (channel) {
        window.lune = channel.objects.lune;
        // Segundo objeto (corte 4): tema, efectos, atajos, radial, bandeja, modo juego y rendimiento
        // (ui/puente_escritorio.py). null con un backend que no lo registra.
        window.luneEscritorio = channel.objects.escritorio || null;
        // Cortes 5/6: alarmas, temporizadores, pantalla grande y salvapantallas (ui/puente_alarmas.py) y
        // baile con la música (ui/puente_musica.py). null con un backend que no los registra.
        window.luneAlarmas = channel.objects.alarmas || null;
        window.luneMusica = channel.objects.musica || null;
        // Cortes 7/8: sentarse, comida, Discord y arranque con Windows (ui/puente_vida.py). null con un
        // backend que no lo registra.
        window.luneVida = channel.objects.vida || null;
        // Cortes 9/10: reproductor de bailes MMD/VRMA y Minecraft (ui/puente_escenario.py). null con un backend que
        // no lo registra.
        window.luneEscenario = channel.objects.escenario || null;
        // 10.9: la lista de tareas estilo To Do sobre la memoria (ui/puente_tareas.py). null con un backend que no
        // lo registra.
        window.luneTareas = channel.objects.tareas || null;
        window.dispatchEvent(new Event('lune-ready'));
      });
    }
  </script>
  <!-- Avatar VRM de la barra lateral: publica window.LuneVRMBarra y lanza 'lune-vrm-barra'.
       three.js solo se descarga si la asistente es VRM (import perezoso). -->
  <script type="module" src="vrm_barra.js"></script>

  <script type="text/babel" src="menu.jsx"></script>

  <script type="text/babel" src="panels.jsx"></script>

  <script type="text/babel" src="extra/voz.jsx"></script>

  <!-- Corte 4 (se registran solos, antes de app.jsx): apariencia.jsx (AparienciaCard, AtajosCard,
       MenuRadialCard, BandejaCard, RadialMenu/RadialHost, LuneRadial, LuneApariencia) y juego.jsx
       (JuegoCard, RendimientoCard, LuneJuego). Hablan con window.luneEscritorio. -->
  <script type="text/babel" src="extra/apariencia.jsx"></script>
  <script type="text/babel" src="extra/juego.jsx"></script>
  <!-- Cortes 5/6 (se registran solos, antes de app.jsx): alarmas.jsx (AlarmasPanel, AlarmaBanner, AlarmasCard,
       PantallaGrandeCard, LuneAlarmas) con window.luneAlarmas y baile.jsx (BaileCard, LuneBaileWeb) con
       window.luneMusica. -->
  <script type="text/babel" src="extra/alarmas.jsx"></script>
  <script type="text/babel" src="extra/baile.jsx"></script>
  <!-- Cortes 7/8 (se registran solos, antes de app.jsx): vida.jsx (SentarseCard, ComidaCard, DiscordCard,
       AutoinicioOpciones, ComidaWeb, LuneVida) con window.luneVida. -->
  <script type="text/babel" src="extra/vida.jsx"></script>
  <!-- Cortes 9/10 (se registran solos, antes de app.jsx): bailes_mmd.jsx (BailesPanel, BailesCard, LuneBailesWeb) y

  <script type="text/babel" src="extra/bailes_mmd.jsx"></script>
  <script type="text/babel" src="extra/minecraft.jsx"></script>

  <script type="text/babel" src="extra/tareas.jsx"></script>

  <script type="text/babel" src="extra/actualizaciones.jsx"></script>
  <!-- 11.3 (se registra solo, antes de app.jsx): diagnostico.jsx (DiagnosticoCard, ProbarOpenRouter, ProbarOllama,
       ProbarTelegram, ProbarDictado, LuneDiagnostico): «Comprobar que todo funciona» y los «Probar» de Ajustes, con
       window.lune. -->
  <script type="text/babel" src="extra/diagnostico.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<window.LuneApp/>);
  </script>
